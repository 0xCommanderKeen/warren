<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:     #e8dfc8;
    --ink-dim: #8b8474;
    --alert:   #ff8f5e;
    --busy:    #ffc86b;
    --panel:   #100d18;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "VT323", "Courier New", monospace;
    background: #142317;
    color: var(--ink);
    overflow: hidden;
  }
  #game { position: absolute; inset: 0; }
  #game canvas { image-rendering: pixelated; }

  /* name chips over villagers — DOM so they stay crisp at any scale */
  #labels { position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
  .chip {
    position: absolute; transform: translate(-50%, -100%);
    pointer-events: auto; cursor: pointer;
    background: rgba(13, 11, 20, .84); color: var(--ink);
    border: 1px solid rgba(232, 223, 200, .22); border-radius: 4px;
    padding: 1px 7px 2px; font-size: 15px; line-height: 1.05;
    text-align: center; white-space: nowrap;
  }
  .chip .dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; }
  .chip .sub { display: block; font-size: 12px; color: var(--ink-dim); }
  .chip.working .sub { color: var(--busy); }
  .chip.knocking { border-color: var(--alert); color: #fff; }
  .chip.knocking .sub { color: var(--alert); }
  .chip.stale { opacity: .55; }
  .chip.you { background: rgba(13, 11, 20, .6); border-color: rgba(232,223,200,.12); }

  header {
    position: absolute; top: 18px; left: 24px; z-index: 20; line-height: 1.1;
    pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.75);
  }
  header h1 { font-size: 42px; font-weight: 400; letter-spacing: 2px; }
  header .tagline { font-size: 18px; color: var(--ink-dim); }
  #census { font-size: 20px; margin-top: 8px; }
  #census .dot { color: var(--ink-dim); }
  #census .attn { color: var(--alert); }
  #lastbeat { font-size: 16px; color: var(--ink-dim); }

  #empty {
    position: absolute; left: 0; right: 0; top: 42vh; text-align: center;
    font-size: 26px; color: var(--ink); z-index: 10; pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.8);
  }
  #empty .sub { font-size: 18px; margin-top: 6px; color: var(--ink-dim); }

  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 380px; z-index: 30;
    background: var(--panel); border-left: 4px solid #2a2438;
    padding: 26px 22px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s steps(4);
  }
  #panel.open { transform: translateX(0); }
  #panel .close {
    position: absolute; top: 14px; right: 16px; font-size: 26px; color: var(--ink-dim);
    cursor: pointer; background: none; border: none; font-family: inherit;
  }
  #panel .close:hover { color: var(--ink); }
  #panel h2 { font-size: 30px; font-weight: 400; }
  #panel .meta { font-size: 17px; color: var(--ink-dim); margin-bottom: 4px; word-break: break-all; }
  #panel .state-line { font-size: 20px; margin: 10px 0 16px; }
  #panel .state-line.attn { color: var(--alert); }
  #panel .state-line.busy { color: var(--busy); }
  .evt { border-top: 2px solid #221d30; padding: 8px 0; font-size: 17px; }
  #panel .meta.role { color: var(--busy); }
  #panel .soul {
    white-space: pre-wrap; font-size: 16px; line-height: 1.25;
    border: 2px solid #221d30; padding: 10px 12px; margin-bottom: 14px;
    color: var(--ink);
  }
  .evt .when { color: var(--ink-dim); font-size: 15px; }
  .evt .what { word-break: break-word; }
  .evt.t-needs_human .what { color: var(--alert); }

  footer {
    position: absolute; bottom: 8px; left: 24px; z-index: 20; pointer-events: none;
    font-size: 15px; color: #cfc7ae; text-shadow: 0 2px 0 rgba(0,0,0,.7);
  }

  /* dev-only: shown *only* when the clock is overridden, so the tint never lies */
  #preview {
    position: absolute; bottom: 8px; right: 24px; z-index: 40; pointer-events: none;
    font-size: 16px; line-height: 1.15; text-align: right;
    color: var(--alert); border: 1px solid var(--alert); border-radius: 4px;
    background: rgba(13, 11, 20, .8); padding: 3px 9px 4px;
  }
  #preview .note { display: block; font-size: 13px; color: var(--ink-dim); }
</style>
<script src="/vendor/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="labels"></div>

<header>
  <h1>burrow</h1>
  <div class="tagline">the village never lies</div>
  <div id="census"></div>
  <div id="lastbeat"></div>
</header>

<div id="empty" style="display:none">
  the village is asleep — nothing is running
  <div class="sub">events will appear from ~/.burrow/events.jsonl</div>
</div>

<aside id="panel">
  <button class="close" title="close">✕</button>
  <div id="panel-body"></div>
</aside>

<footer>burrow v0.5 · a projection, never a simulation · art: Ninja Adventure (CC0)</footer>
<div id="preview" hidden></div>

<script>
"use strict";

/* ————— shared projection logic (docs/protocol.md, v0 rules) ————— */

const NAMES = ["Bramble","Poppy","Wren","Sorrel","Fern","Alder","Maple","Rowan",
               "Thistle","Clover","Hazel","Juniper","Moss","Reed","Tansy","Willow"];
const ACCENTS = ["#7d5ba6","#4f7d5b","#a65b5b","#5b7da6","#a68a4f","#5ba69b",
                 "#a65b8a","#6b7da0","#8aa65b","#a6764f"];
const CHARS = ["Villager","Villager2","Villager3","Villager4","Villager5",
               "Woman","Boy","OldMan","Princess","Hunter","Noble","Monk"];
const STALE_MS = 30 * 60 * 1000;
const DROP_MS  = 12 * 60 * 60 * 1000;
const VERBS = {
  Read: "reading", Grep: "searching", Glob: "searching", WebSearch: "researching",
  WebFetch: "researching", Bash: "tinkering", Write: "crafting", Edit: "crafting",
  NotebookEdit: "crafting", Agent: "delegating", Task: "delegating",
  AskUserQuestion: "asking you", Skill: "consulting a manual", Workflow: "orchestrating",
};

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function ago(ts, now) {
  const s = Math.max(0, Math.round((now - ts) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return (s / 3600).toFixed(1) + "h ago";
}
function describe(ev) {
  const p = ev.payload || {};
  switch (ev.type) {
    case "task_started":      return "took up a task: “" + (p.prompt || "…") + "”";
    case "tool_called":       return (VERBS[p.tool] || "using " + p.tool) +
                                     (p.detail ? " — " + p.detail : "");
    case "artifact_produced": return "crafted " + (p.artifact || "something");
    case "needs_human":       return "needs you: " + (p.message || "(no message)");
    case "idle":              return "finished, resting";
    case "session_ended":     return "went home";
    default:                  return ev.type;
  }
}
function doingLabel(ev) {
  const p = ev.payload || {};
  switch (ev.type) {
    case "task_started":      return "starting a task";
    case "tool_called":       return VERBS[p.tool] || ("using " + p.tool);
    case "artifact_produced": return "crafting";
    default:                  return "";
  }
}
const EVENT_TYPES = new Set(["task_started","tool_called","artifact_produced",
                             "needs_human","idle","session_ended"]);
function reduce(lines, now, souls) {
  const soulByAgent = new Map(), soulByProject = new Map();
  for (const s of souls || []) {
    if (!s || !s.meta) continue;
    if (s.meta.agent_id) soulByAgent.set(s.meta.agent_id, s);
    if (s.meta.project) soulByProject.set(s.meta.project, s);
  }
  const usedSouls = new Set();
  const agents = new Map();
  for (const line of lines) {
    let ev;
    try { ev = JSON.parse(line); } catch { continue; }
    if (!ev || !ev.agent_id || !EVENT_TYPES.has(ev.type)) continue;
    let a = agents.get(ev.agent_id);
    if (!a) { a = { id: ev.agent_id, events: [] }; agents.set(ev.agent_id, a); }
    a.events.push(ev);
    if (a.events.length > 80) a.events.shift();
  }
  const out = [];
  const takenNames = new Set(), takenChars = new Set();
  const sorted = [...agents.values()].sort((x, y) => x.id < y.id ? -1 : 1);
  for (const a of sorted) {
    const last = a.events[a.events.length - 1];
    const lastTs = Date.parse(last.ts) || 0;
    if (last.type === "session_ended") continue;
    if (now - lastTs > DROP_MS) continue;
    let state =
      last.type === "needs_human" ? "knocking" :
      last.type === "idle"        ? "resting"  : "working";
    if (state === "working" && now - lastTs > STALE_MS) state = "stale";
    const h = hashCode(a.id);
    const project = last.project || "unknown";
    // soul files pin identity: exact agent_id beats project match
    let soul = soulByAgent.get(a.id);
    if (!soul || usedSouls.has(soul)) {
      const p = soulByProject.get(project);
      soul = p && !usedSouls.has(p) ? p : soul && !usedSouls.has(soul) ? soul : null;
    }
    if (soul) usedSouls.add(soul);
    // probe past hash collisions so every villager in view looks distinct
    let n = 0;
    while (takenNames.has(NAMES[(h + n) % NAMES.length]) && n < NAMES.length) n++;
    let c = 0;
    while (takenChars.has(CHARS[(h + c) % CHARS.length]) && c < CHARS.length) c++;
    let name = NAMES[(h + n) % NAMES.length];
    let char = CHARS[(h + c) % CHARS.length];
    let accent = ACCENTS[(h + n) % ACCENTS.length];
    if (soul) {
      if (soul.meta.name) name = soul.meta.name;
      if (CHARS.includes(soul.meta.char)) char = soul.meta.char;
      if (soul.meta.accent) accent = soul.meta.accent;
    }
    takenNames.add(name);
    takenChars.add(char);
    out.push({
      id: a.id, state, lastTs, events: a.events,
      name, char, accent, soul,
      project,
      cwd: last.cwd || "",
      doing: state === "working" ? doingLabel(last) : "",
      lastLine: describe(last),
    });
  }
  return out;
}

/* ————— daylight: a projection of the real local clock, nothing else —————

   No weather, no seasons, no simulated sky: the only input is what time it is
   on this machine right now. The tint is a multiply overlay over the world, so
   pixel art keeps its contrast instead of being washed out; light sources (door
   and window lights, the "!" over a knocker) are drawn *above* the overlay so
   every state signal stays legible in the darkest phase.                     */

// [hour, multiply tint, darkness 0..1]; interpolated with smoothstep, wraps at 24h
const SKY = [
  [ 0.00, 0x47539c, 1.00],   // night
  [ 4.50, 0x47539c, 1.00],
  [ 6.00, 0x8f7fb8, 0.60],   // first light
  [ 6.75, 0xf5b9a2, 0.26],   // dawn, rosy
  [ 8.00, 0xffffff, 0.00],   // day
  [17.00, 0xffffff, 0.00],
  [18.75, 0xf5a460, 0.26],   // dusk, amber
  [19.75, 0x9070ac, 0.60],   // afterglow
  [21.00, 0x47539c, 1.00],   // night
  [24.00, 0x47539c, 1.00],
];
const PHASES = { dawn: 6.75, day: 12.5, dusk: 18.75, night: 23 };

function phaseOf(hour) {
  if (hour < 5.25 || hour >= 20.5) return "night";
  if (hour < 7.75) return "dawn";
  if (hour < 17.5) return "day";
  return "dusk";
}
function mixRGB(a, b, t) {
  const ch = (sh) => {
    const x = (a >> sh) & 255, y = (b >> sh) & 255;
    return Math.round(x + (y - x) * t) << sh;
  };
  return ch(16) | ch(8) | ch(0);
}
function skyAt(hour) {
  const h = ((hour % 24) + 24) % 24;
  let i = 1;
  while (i < SKY.length - 1 && SKY[i][0] < h) i++;
  const [h0, c0, d0] = SKY[i - 1], [h1, c1, d1] = SKY[i];
  const t = h1 === h0 ? 0 : Math.min(1, Math.max(0, (h - h0) / (h1 - h0)));
  const s = t * t * (3 - 2 * t);   // smoothstep: no visible seam at a keyframe
  return { hour: h, phase: phaseOf(h), color: mixRGB(c0, c1, s), dark: d0 + (d1 - d0) * s };
}

/* dev preview: ?phase=dawn|day|dusk|night, ?time=20:45, ?cycle[=seconds].
   Any of these pins or sweeps the clock *and* shows a badge saying so — normal
   use (no query params) is always the real local time. */
const PREVIEW = (() => {
  const q = new URLSearchParams(location.search);
  const cycle = q.get("cycle");
  if (cycle !== null) return { cycle: Math.max(4, Number(cycle) || 60) };
  const time = q.get("time");
  if (time && /^\d{1,2}(:\d{2})?$/.test(time)) {
    const [hh, mm] = time.split(":");
    return { hour: (Number(hh) + (Number(mm) || 0) / 60) % 24 };
  }
  const phase = (q.get("phase") || "").toLowerCase();
  if (phase in PHASES) return { hour: PHASES[phase] };
  return null;
})();
const BOOT = Date.now();

function clockHour() {
  if (PREVIEW && PREVIEW.cycle) return ((Date.now() - BOOT) / 1000 / PREVIEW.cycle % 1) * 24;
  if (PREVIEW) return PREVIEW.hour;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function hhmm(hour) {
  const h = Math.floor(hour), m = Math.floor((hour - h) * 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

/* ————— the village scene ————— */

const T = 16, MAPW = 32, MAPH = 22, ZOOM = 3;
const FLOOR_COLS = 22;
const GRASS = 11 * FLOOR_COLS + 3, GRASS2 = 11 * FLOOR_COLS + 2;
// dirt autotile block: cols 0-2 × rows 7-9 of the floor tileset (edges + center)
const DIRT_AT = (col, row) => row * FLOOR_COLS + col;
const DECOR = [[32,160],[48,160],[0,160],[16,160],[0,176],[16,176],[96,176],[112,176]];
// villager house plots: [tileX, tileY], houses are 4×3 tiles, door bottom-center
const PLOTS = [[3,8],[8,8],[20,8],[25,8],[3,16],[8,16],[20,16],[25,16]];
const YOUR_HOUSE = { tx: 14, ty: 3 };   // 3×3 tiles, A-frame
const WALK_SPEED = 55;                  // px/s, native scale
const SKY_DEPTH = 4000;                 // the day/night overlay…
const LIGHT_DEPTH = 4001;               // …and everything that must stay lit above it
// openings in the 64×48 house frames, measured off the tileset: [cx, cy, w, h]
const DOORWAY = [24, 42, 40, 34];
const WINDOWS = [[9, 38, 20, 22], [40, 38, 24, 22], [55, 38, 21, 22]];
const HAS_WINDOWS = { 0: true, 3: true };   // frames h1/h2 are blank-walled
const LAMP_WARM  = [255, 177, 74];      // doorway lamplight
const WIN_WARM   = [255, 207, 122];     // light through a window
const KNOCK_WARM = [255, 143, 94];      // your porch, while someone is knocking
// direction indices in the character sheets: columns = down, up, left, right
const D_DOWN = 0, D_UP = 1, D_LEFT = 2, D_RIGHT = 3;

function plotDoor(i) {
  const [px, py] = PLOTS[i];
  return { x: px * T + 32, y: (py + 3) * T };
}
const yourDoor = { x: YOUR_HOUSE.tx * T + 24, y: (YOUR_HOUSE.ty + 3) * T };

class Village extends Phaser.Scene {
  constructor() { super("village"); this.viz = new Map(); this.plotOf = new Map(); }

  preload() {
    this.load.image("floor",  "/assets/tilesets/TilesetFloor.png");
    this.load.image("houses", "/assets/tilesets/TilesetHouse.png");
    this.load.image("nature", "/assets/tilesets/TilesetNature.png");
    this.load.image("shadow", "/assets/shadow.png");
    for (const c of CHARS) {
      this.load.spritesheet(c + "-walk", "/assets/characters/" + c + "-walk.png",
                            { frameWidth: 16, frameHeight: 16 });
      this.load.spritesheet(c + "-idle", "/assets/characters/" + c + "-idle.png",
                            { frameWidth: 16, frameHeight: 16 });
    }
  }

  create() {
    this.cameras.main.setZoom(ZOOM);
    this.cameras.main.centerOn(MAPW * T / 2, MAPH * T / 2);
    // named frames for prefab buildings and trees
    const houses = this.textures.get("houses");
    for (let i = 0; i < 4; i++) houses.add("h" + i, 0, i * 64, 0, 64, 48);
    houses.add("yours", 0, 416, 0, 48, 48);
    const nature = this.textures.get("nature");
    nature.add("tree0", 0, 0, 0, 32, 32);
    nature.add("tree1", 0, 32, 0, 32, 32);
    DECOR.forEach(([x, y], i) => nature.add("d" + i, 0, x, y, 16, 16));

    this.buildGround();
    this.buildBuildings();
    this.buildTrees();
    this.buildDecor();
    this.buildSky();

    for (const c of CHARS) {
      for (const d of [D_DOWN, D_UP, D_LEFT, D_RIGHT]) {
        this.anims.create({
          key: c + "-walk-" + d,
          frames: this.anims.generateFrameNumbers(c + "-walk",
                    { frames: [d, d + 4, d + 8, d + 12] }),
          frameRate: 8, repeat: -1,
        });
      }
    }

    this.input.on("gameobjectdown", (_p, obj) => {
      if (obj.getData("agent")) openPanel(obj.getData("agent"));
    });
    this.events.on("update", () => {
      for (const v of this.viz.values()) {
        v.cont.setDepth(v.cont.y);
        v.chip.wx = v.cont.x;
        v.chip.wy = v.cont.y - 11;
        v.bang.setPosition(v.cont.x + 9, v.cont.y - 5);
        v.zzz.setPosition(v.cont.x + 6, v.cont.y - 6);
      }
      this.layoutChips();
      this.applySky();
    });
  }

  buildSky() {
    this.sky = this.add.rectangle(0, 0, MAPW * T, MAPH * T, 0xffffff)
      .setOrigin(0, 0).setDepth(SKY_DEPTH).setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.skyState = null;
    this.applySky();
  }

  /* Repaint the village for the current clock. Cheap enough to run every frame;
     only DOM writes are guarded, so a `?cycle` sweep stays perfectly smooth. */
  applySky() {
    const sky = skyAt(clockHour());
    this.sky.setFillStyle(sky.color, 1);
    const dark = sky.dark;
    for (const lamp of this.lamps) {
      // a working agent lights its doorway all day and burns brighter after dark;
      // a villager that is merely home gets a soft doorway light once it is dark
      const door = lamp.working ? .55 + .40 * dark : lamp.home ? .30 * dark : 0;
      lamp.door.setVisible(door > .02).setAlpha(door);
      // windows warm up after dark, but only where the art has them
      const win = lamp.home ? .55 * dark : 0;
      for (const w of lamp.windows) w.setVisible(win > .02).setAlpha(win);
    }
    const knock = this.knockers ? .20 + .5 * dark : 0;
    this.knockGlow.setVisible(knock > .02).setAlpha(knock);
    // keep the stale fade readable against a dark village without un-fading it
    for (const v of this.viz.values())
      if (v.state === "stale") v.cont.setAlpha(.45 + .15 * dark);
    if (!this.skyState || this.skyState.color !== sky.color ||
        this.skyState.phase !== sky.phase || Math.abs(this.skyState.hour - sky.hour) > .02)
      renderSky(sky);
    this.skyState = sky;
  }

  buildGround() {
    const dirt = Array.from({ length: MAPH }, () => Array(MAPW).fill(false));
    const mark = (x0, x1, y0, y1) => {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) dirt[y][x] = true;
    };
    mark(2, 29, 12, 14);                       // main street
    mark(14, 17, 6, 11);                       // lane from your door to the street
    mark(12, 19, 6, 8);                        // plaza at your door
    for (const [px, py] of PLOTS) mark(px + 1, px + 2, py + 3, py + 3); // door stubs
    this.dirt = dirt;
    const rows = [];
    for (let y = 0; y < MAPH; y++) {
      const row = [];
      for (let x = 0; x < MAPW; x++) {
        if (!dirt[y][x]) {
          row.push(hashCode(x + "," + y) % 11 === 0 ? GRASS2 : GRASS);
          continue;
        }
        const gN = y > 0 && !dirt[y - 1][x], gS = y < MAPH - 1 && !dirt[y + 1][x];
        const gW = x > 0 && !dirt[y][x - 1], gE = x < MAPW - 1 && !dirt[y][x + 1];
        const col = gW && !gE ? 0 : gE && !gW ? 2 : 1;
        const r   = gN && !gS ? 7 : gS && !gN ? 9 : 8;
        row.push(DIRT_AT(col, r));
      }
      rows.push(row);
    }
    const map = this.make.tilemap({ data: rows, tileWidth: T, tileHeight: T });
    map.createLayer(0, map.addTilesetImage("floor"), 0, 0).setDepth(-10);
  }

  buildDecor() {
    const blocked = (x, y) => {
      if (this.dirt[y][x]) return true;
      for (const [px, py] of PLOTS.concat([[YOUR_HOUSE.tx, YOUR_HOUSE.ty]]))
        if (x >= px - 1 && x <= px + 4 && y >= py - 1 && y <= py + 3) return true;
      return false;
    };
    for (let y = 3; y < MAPH - 2; y++) {
      for (let x = 3; x < MAPW - 3; x++) {
        const h = hashCode(y + ":" + x);
        if (h % 8 !== 0 || blocked(x, y)) continue;
        this.add.image(x * T + 8, y * T + 16, "nature", "d" + ((h >> 4) % DECOR.length))
          .setOrigin(.5, 1).setDepth(0);
      }
    }
  }

  /* Soft warm glow, baked into a texture per colour: additive tinting is a
     WebGL-only trick and the viewer must survive Phaser's canvas fallback. */
  makeGlow(key, [r, g, b]) {
    if (this.textures.exists(key)) return;
    const S = 64, tex = this.textures.createCanvas(key, S, S);
    const ctx = tex.getContext();
    const grad = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(.4, `rgba(${r},${g},${b},.62)`);
    grad.addColorStop(.75, `rgba(${r},${g},${b},.16)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, S, S);
    tex.refresh();
  }

  buildBuildings() {
    this.makeGlow("glow-lamp", LAMP_WARM);
    this.makeGlow("glow-win", WIN_WARM);
    this.lamps = [];
    PLOTS.forEach(([px, py], i) => {
      const frame = i % 4;
      this.add.image(px * T, py * T, "houses", "h" + frame)
        .setOrigin(0, 0).setDepth((py + 3) * T);
      // Warm light in the doorway while its agent works — off otherwise. Drawn
      // above the day/night overlay: a lamp is a light source, not a lit surface.
      const glow = ([cx, cy, w, h], key) =>
        this.add.image(px * T + cx, py * T + cy, key)
          .setDisplaySize(w, h).setDepth(LIGHT_DEPTH).setVisible(false)
          .setBlendMode(Phaser.BlendModes.ADD);   // light adds, it doesn't paint
      this.lamps.push({
        door: glow(DOORWAY, "glow-lamp"),
        // windows only where the art has them; they warm up after dark, and only
        // for a house whose villager is actually home
        windows: HAS_WINDOWS[frame] ? WINDOWS.map(w => glow(w, "glow-win")) : [],
        working: false, home: false,
      });
    });
    this.add.image(YOUR_HOUSE.tx * T, YOUR_HOUSE.ty * T, "houses", "yours")
      .setOrigin(0, 0).setDepth((YOUR_HOUSE.ty + 3) * T);
    // your porch light, on only while somebody is actually at your door — it is
    // the one signal that must never get lost in the dark, so it grows with night
    this.makeGlow("glow-knock", KNOCK_WARM);
    this.knockers = 0;
    this.knockGlow = this.add.image(yourDoor.x, yourDoor.y - 8, "glow-knock")
      .setDisplaySize(46, 40).setDepth(LIGHT_DEPTH).setVisible(false)
      .setBlendMode(Phaser.BlendModes.ADD);
    this.chips = [];
    this.makeChip(null, "#ffc86b", yourDoor.x, YOUR_HOUSE.ty * T - 2, "you")
      .el.classList.add("you");
  }

  makeChip(id, accent, wx, wy, name, sub) {
    const el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = `<span class="dot" style="background:${accent}"></span><span class="nm"></span><span class="sub"></span>`;
    el.querySelector(".nm").textContent = name;
    el.querySelector(".sub").textContent = sub || "";
    if (!sub) el.querySelector(".sub").style.display = "none";
    if (id) el.addEventListener("click", () => openPanel(id));
    document.getElementById("labels").appendChild(el);
    const chip = { el, wx, wy };
    this.chips.push(chip);
    return chip;
  }

  layoutChips() {
    const rect = this.game.canvas.getBoundingClientRect();
    const s = rect.width / (MAPW * T * ZOOM);
    for (const c of this.chips) {
      c.el.style.left = (rect.left + c.wx * ZOOM * s) + "px";
      c.el.style.top  = (rect.top  + c.wy * ZOOM * s) + "px";
    }
  }

  buildTrees() {
    const tree = (x, y, i) =>
      this.add.image(x, y, "nature", "tree" + (i % 2)).setOrigin(.5, 1).setDepth(y);
    for (let i = 0; i < MAPW / 2; i++) {
      tree(i * 32 + 16, 34, i);
      tree(i * 32 + 16, MAPH * T, i + 1);
    }
    for (let i = 2; i < 10; i++) {
      tree(16, i * 32 + 2, i);
      tree(MAPW * T - 16, i * 32 + 2, i + 1);
    }
    tree(12 * T, 6 * T, 0); tree(20 * T, 6 * T, 1);   // accents by the plaza
  }

  text(x, y, str, color, size) {
    // rendered at 3× and drawn at ⅓: crisp at ZOOM, and unlike setResolution()
    // it survives the WebGL renderer, where the "!" was coming out as a smudge
    return this.add.text(x, y, str, {
      fontFamily: "VT323", fontSize: (size || 8) * 3 + "px", color,
    }).setOrigin(.5, 1).setScale(1 / 3).setDepth(9000)
      .setShadow(0, 3, "#000000", 0, true, true);
  }

  /* ————— villagers ————— */

  assignPlot(id) {
    if (this.plotOf.has(id)) return this.plotOf.get(id);
    const used = new Set(this.plotOf.values());
    for (let i = 0; i < PLOTS.length; i++)
      if (!used.has(i)) { this.plotOf.set(id, i); return i; }
    this.plotOf.set(id, -1);   // village is full: traveler without a house
    return -1;
  }

  spotFor(v, viz, knockSlot) {
    if (viz.plot < 0) {   // traveler rests/works on the street
      const rx = 48 + (hashCode(viz.id) % 14) * 28;
      if (v.state === "knocking") { /* fall through to door */ }
      else return { x: rx, y: 13 * T + 8, kind: v.state };
    }
    const door = viz.plot >= 0 ? plotDoor(viz.plot) : null;
    switch (v.state) {
      case "knocking": return { x: yourDoor.x + (knockSlot % 4) * 26 - 39,
                                y: yourDoor.y + 10 + Math.floor(knockSlot / 4) * 16,
                                kind: "knocking" };
      case "working":  return { x: door.x, y: door.y + 14, kind: "working" };
      default:         return { x: door.x, y: door.y + 2,  kind: "resting" };
    }
  }

  spawn(v) {
    const plot = this.assignPlot(v.id);
    const door = plot >= 0 ? plotDoor(plot) : { x: 48 + (hashCode(v.id) % 14) * 28, y: 13 * T + 8 };
    const cont = this.add.container(door.x, door.y + 2);
    const shadow = this.add.image(0, 7, "shadow").setAlpha(.35);
    const spr = this.add.sprite(0, 0, v.char + "-idle", D_DOWN);
    // knock "!" and sleep "z" live above the day/night overlay and follow the
    // container from the update loop: state must not dim just because it's night
    const bang = this.text(cont.x + 9, cont.y - 5, "!", "#ff8f5e", 10)
      .setDepth(LIGHT_DEPTH).setVisible(false);
    const zzz  = this.text(cont.x + 6, cont.y - 6, "z", "#cfc7ae", 8)
      .setDepth(LIGHT_DEPTH).setVisible(false);
    cont.add([shadow, spr]);
    cont.setSize(14, 16).setInteractive({ useHandCursor: true });
    cont.setData("agent", v.id);
    spr.setData("agent", v.id);
    const chip = this.makeChip(v.id, v.accent, cont.x, cont.y - 11, v.name, v.project);
    const viz = { id: v.id, cont, spr, bang, zzz, chip, plot, char: v.char,
                  state: "", lastTs: 0, target: null, walk: null };
    this.viz.set(v.id, viz);
    return viz;
  }

  despawn(id) {
    const viz = this.viz.get(id);
    if (!viz) return;
    if (viz.walk) viz.walk.destroy();
    viz.chip.el.remove();
    this.chips = this.chips.filter(c => c !== viz.chip);
    viz.bang.destroy();
    viz.zzz.destroy();
    viz.cont.destroy();
    this.viz.delete(id);
    this.plotOf.delete(id);
  }

  walkTo(viz, tx, ty) {
    if (viz.walk) { viz.walk.destroy(); viz.walk = null; }
    const c = viz.cont, char = viz.spr.texture.key.replace("-idle", "").replace("-walk", "");
    const legs = [];
    const dx = tx - c.x, dy = ty - c.y;
    if (Math.abs(dx) > 1) legs.push({
      x: tx, duration: Math.abs(dx) / WALK_SPEED * 1000,
      onStart: () => viz.spr.play(char + "-walk-" + (dx > 0 ? D_RIGHT : D_LEFT)),
    });
    if (Math.abs(dy) > 1) legs.push({
      y: ty, duration: Math.abs(dy) / WALK_SPEED * 1000,
      onStart: () => viz.spr.play(char + "-walk-" + (dy > 0 ? D_DOWN : D_UP)),
    });
    const settle = () => {
      viz.spr.stop();
      viz.spr.setTexture(char + "-idle", D_DOWN);
      viz.walk = null;
    };
    if (!legs.length) { settle(); return; }
    viz.walk = this.tweens.chain({ targets: c, tweens: legs, onComplete: settle });
  }

  hop(viz) {   // one real event just arrived → one small hop; never loops
    this.tweens.add({ targets: viz.spr, y: -3, duration: 110, yoyo: true });
  }

  updateVillage(list) {
    const seen = new Set();
    let knockSlot = 0;
    const dark = this.skyState ? this.skyState.dark : 0;
    for (const lamp of this.lamps) { lamp.working = false; lamp.home = false; }
    for (const v of list) {
      seen.add(v.id);
      let viz = this.viz.get(v.id);
      const isNew = !viz;
      if (isNew) viz = this.spawn(v);

      viz.chip.el.className = "chip " + v.state;
      viz.chip.el.querySelector(".nm").textContent = v.name;
      viz.chip.el.querySelector(".dot").style.background = v.accent;
      if (!isNew && v.char !== viz.char) {   // soul file edited → new sprite
        viz.spr.stop();
        viz.spr.setTexture(v.char + "-idle", D_DOWN);
      }
      viz.char = v.char;
      const sub = viz.chip.el.querySelector(".sub");
      const subText =
        v.state === "knocking" ? "needs you!" :
        v.state === "stale"    ? v.project + " · no signal" :
        v.state === "working" && v.doing ? v.project + " · " + v.doing : v.project;
      sub.textContent = subText;
      sub.style.display = "";

      if (!isNew && v.lastTs > viz.lastTs && v.state === "working") this.hop(viz);
      viz.lastTs = v.lastTs;

      const slot = v.state === "knocking" ? knockSlot++ : 0;
      const spot = this.spotFor(v, viz, slot);
      const moved = !viz.target || viz.target.x !== spot.x || viz.target.y !== spot.y;
      if (isNew) {
        viz.cont.setPosition(spot.x, spot.y);
        viz.target = spot;
        viz.spr.setTexture(v.char + "-idle", D_DOWN);
      } else if (moved || v.state !== viz.state) {
        viz.target = spot;
        this.walkTo(viz, spot.x, spot.y);
      }
      viz.state = v.state;

      const stale = v.state === "stale";
      viz.cont.setAlpha(stale ? .45 + .15 * dark : 1);
      viz.bang.setVisible(v.state === "knocking");
      viz.zzz.setVisible(v.state === "resting");
      if (viz.plot >= 0) {
        const lamp = this.lamps[viz.plot];
        lamp.working = v.state === "working";
        // lit windows mean someone is genuinely home: not away at your door,
        // and not stale (no signal — we don't know where they are)
        lamp.home = v.state === "working" || v.state === "resting";
      }
    }
    for (const id of [...this.viz.keys()])
      if (!seen.has(id)) this.despawn(id);
    this.knockers = knockSlot;
    this.applySky();
  }
}

/* ————— DOM chrome: census, panel, poll loop ————— */

const censusEl  = document.getElementById("census");
const beatEl    = document.getElementById("lastbeat");
const emptyEl   = document.getElementById("empty");
const panelEl   = document.getElementById("panel");
const panelBody = document.getElementById("panel-body");

let villagers = [];
let selectedId = null;
let scene = null;

function renderChrome(now) {
  emptyEl.style.display = villagers.length ? "none" : "block";
  const knockers = villagers.filter(v => v.state === "knocking").length;
  const working  = villagers.filter(v => v.state === "working").length;
  const resting  = villagers.filter(v => v.state === "resting").length;
  const parts = [`${villagers.length} villager${villagers.length === 1 ? "" : "s"}`];
  if (working) parts.push(`${working} working`);
  if (resting) parts.push(`${resting} resting`);
  censusEl.innerHTML = parts.join('<span class="dot"> · </span>') +
    (knockers ? `<span class="dot"> · </span><span class="attn">${knockers} at your door</span>` : "");
  const newest = Math.max(0, ...villagers.map(v => v.lastTs));
  beatEl.textContent = newest ? "last signal " + ago(newest, now) : "";
  if (selectedId) renderPanel(now);
}

const previewEl = document.getElementById("preview");
const PAGE_BG = [0x14, 0x23, 0x17];   // the letterboxed area around the village

/* the DOM half of the daylight projection: page background, a `data-phase` hook,
   and — only when the clock is overridden — a badge that says so out loud */
function renderSky(sky) {
  const bg = PAGE_BG.map((c, i) => Math.round(c * ((sky.color >> (16 - i * 8)) & 255) / 255));
  document.body.style.background = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  document.body.dataset.phase = sky.phase;
  document.body.dataset.clock = hhmm(sky.hour);
  if (!PREVIEW) { previewEl.hidden = true; return; }
  previewEl.hidden = false;
  previewEl.innerHTML = `preview: ${esc(sky.phase)} · ${hhmm(sky.hour)}` +
    `<span class="note">dev override — not the real clock</span>`;
}

function openPanel(id) { selectedId = id; renderPanel(Date.now()); }
function renderPanel(now) {
  const v = villagers.find(x => x.id === selectedId);
  if (!v) { closePanel(); return; }
  const stateText =
    v.state === "knocking" ? "at your door — needs you" :
    v.state === "working"  ? (v.doing || "working") :
    v.state === "stale"    ? "no signal for a while" : "resting";
  const cls = v.state === "knocking" ? "attn" : v.state === "working" ? "busy" : "";
  panelBody.innerHTML = `
    <h2><span style="color:${v.accent}">▪</span> ${esc(v.name)}</h2>
    ${v.soul && v.soul.meta.role ? `<div class="meta role">${esc(v.soul.meta.role)}</div>` : ""}
    <div class="meta">${esc(v.project)} · ${esc(v.cwd)}</div>
    <div class="meta">${esc(v.id)}</div>
    <div class="state-line ${cls}">${esc(stateText)}</div>
    ${v.soul && v.soul.body ? `<div class="soul">${esc(v.soul.body)}</div>` : ""}
    ${v.events.slice().reverse().map(ev => `
      <div class="evt t-${esc(ev.type)}">
        <div class="when">${ago(Date.parse(ev.ts) || 0, now)} · ${esc(ev.type)}</div>
        <div class="what">${esc(describe(ev))}</div>
      </div>`).join("")}`;
  panelEl.classList.add("open");
}
function closePanel() { selectedId = null; panelEl.classList.remove("open"); }
panelEl.querySelector(".close").addEventListener("click", closePanel);

let souls = [];
async function poll() {
  try {
    const [evRes, soulRes] = await Promise.all([
      fetch("/events", { cache: "no-store" }),
      fetch("/villagers", { cache: "no-store" }).catch(() => null),
    ]);
    const text = await evRes.text();
    if (soulRes && soulRes.ok) { try { souls = await soulRes.json(); } catch {} }
    const now = Date.now();
    villagers = reduce(text.split("\n").filter(Boolean).slice(-4000), now, souls);
    if (scene && scene.scene.isActive()) scene.updateVillage(villagers);
    renderChrome(now);
  } catch {
    beatEl.textContent = "server unreachable";
  }
}

/* ————— boot ————— */

(async () => {
  try { await document.fonts.load('16px "VT323"'); } catch {}
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game",
    width: MAPW * T * ZOOM, height: MAPH * T * ZOOM,
    pixelArt: true, roundPixels: true,
    backgroundColor: "#142317",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: Village,
  });
  window.__burrow = game;
  game.events.on("ready", () => {
    scene = game.scene.getScene("village");
    scene.events.once("create", () => { poll(); setInterval(poll, 2000); });
  });
})();
</script>
