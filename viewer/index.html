<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:     #e8dfc8;
    --ink-dim: #8b8474;
    --alert:   #ff8f5e;
    --busy:    #ffc86b;
    --panel:   #100d18;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "VT323", "Courier New", monospace;
    background: #142317;
    color: var(--ink);
    overflow: hidden;
  }
  #game { position: absolute; inset: 0; }
  #game canvas { image-rendering: pixelated; }

  /* name chips over villagers — DOM so they stay crisp at any scale */
  #labels { position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
  .chip {
    position: absolute; transform: translate(-50%, -100%);
    pointer-events: auto; cursor: pointer;
    background: rgba(13, 11, 20, .84); color: var(--ink);
    border: 1px solid rgba(232, 223, 200, .22); border-radius: 4px;
    padding: 1px 7px 2px; font-size: 15px; line-height: 1.05;
    text-align: center; white-space: nowrap;
  }
  .chip .dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; }
  .chip .sub { display: block; font-size: 12px; color: var(--ink-dim); }
  .chip.working .sub { color: var(--busy); }
  .chip.knocking { border-color: var(--alert); color: #fff; }
  .chip.knocking .sub { color: var(--alert); }
  .chip.stale { opacity: .55; }
  .chip.you, .chip.place {
    background: rgba(13, 11, 20, .6); border-color: rgba(232,223,200,.12);
  }

  header {
    position: absolute; top: 18px; left: 24px; z-index: 20; line-height: 1.1;
    pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.75);
  }
  header h1 { font-size: 42px; font-weight: 400; letter-spacing: 2px; }
  header .tagline { font-size: 18px; color: var(--ink-dim); }
  #census { font-size: 20px; margin-top: 8px; }
  #census .dot { color: var(--ink-dim); }
  #census .attn { color: var(--alert); }
  #lastbeat { font-size: 16px; color: var(--ink-dim); }

  #empty {
    position: absolute; left: 0; right: 0; top: 42vh; text-align: center;
    font-size: 26px; color: var(--ink); z-index: 10; pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.8);
  }
  #empty .sub { font-size: 18px; margin-top: 6px; color: var(--ink-dim); }

  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 380px; z-index: 30;
    background: var(--panel); border-left: 4px solid #2a2438;
    padding: 26px 22px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s steps(4);
  }
  #panel.open { transform: translateX(0); }
  #panel .close {
    position: absolute; top: 14px; right: 16px; font-size: 26px; color: var(--ink-dim);
    cursor: pointer; background: none; border: none; font-family: inherit;
  }
  #panel .close:hover { color: var(--ink); }
  #panel h2 { font-size: 30px; font-weight: 400; }
  #panel .meta { font-size: 17px; color: var(--ink-dim); margin-bottom: 4px; word-break: break-all; }
  #panel .state-line { font-size: 20px; margin: 10px 0 16px; }
  #panel .state-line.attn { color: var(--alert); }
  #panel .state-line.busy { color: var(--busy); }
  /* a knock is the one thing you must not have to squint at */
  #panel .knock {
    border: 2px solid var(--alert); border-left-width: 6px;
    background: rgba(255, 143, 94, .09);
    padding: 10px 12px 12px; margin: 0 0 16px;
  }
  #panel .knock .knock-h {
    font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--alert); margin-bottom: 6px;
  }
  #panel .knock .knock-msg {
    font-size: 22px; line-height: 1.2; color: #fff;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #panel .knock .knock-when { font-size: 15px; color: var(--ink-dim); margin-top: 8px; }
  .evt { border-top: 2px solid #221d30; padding: 8px 0; font-size: 17px; }
  #panel .meta.role { color: var(--busy); }
  #panel .soul {
    white-space: pre-wrap; font-size: 16px; line-height: 1.25;
    border: 2px solid #221d30; padding: 10px 12px; margin-bottom: 14px;
    color: var(--ink);
  }
  .evt .when { color: var(--ink-dim); font-size: 15px; }
  .evt .what { word-break: break-word; }
  .evt.t-needs_human .what { color: var(--alert); }

  footer {
    position: absolute; bottom: 8px; left: 24px; z-index: 20; pointer-events: none;
    font-size: 15px; color: #cfc7ae; text-shadow: 0 2px 0 rgba(0,0,0,.7);
  }
  #preview {
    position: absolute; bottom: 8px; right: 24px; z-index: 40; pointer-events: none;
    font-size: 16px; color: var(--alert); border: 1px solid var(--alert);
    background: rgba(13,11,20,.8); padding: 3px 9px 4px;
  }
  #preview .note { display:block; font-size:13px; color:var(--ink-dim); }
</style>
<script src="/vendor/phaser.min.js"></script>
<script src="/presence.js"></script>
<script src="/projection.js"></script>
</head>
<body>
<div id="game"></div>
<div id="labels"></div>

<header>
  <h1>burrow</h1>
  <div class="tagline">the village never lies</div>
  <div id="census"></div>
  <div id="lastbeat"></div>
</header>

<div id="empty" style="display:none">
  the village is asleep — nothing is running
  <div class="sub">events will appear from ~/.burrow/events.jsonl</div>
</div>

<aside id="panel">
  <button class="close" title="close">✕</button>
  <div id="panel-body"></div>
</aside>

<footer>burrow v0.5 · a projection, never a simulation · art: Ninja Adventure (CC0)</footer>
<div id="preview" hidden></div>

<script src="/routes.js"></script>
<script>
"use strict";

/* projection logic (event filtering, state mapping, souls, identities) lives in
   /projection.js — same file the test suite in tests/ runs under node. It gives
   this script: NAMES, ACCENTS, CHARS, STALE_MS, DROP_MS, VERBS, hashCode, esc,
   ago, describe, doingLabel, foldEvents, reduce. */

/* ————— the village scene ————— */

const SKY = [[0,0x47539c,1],[4.5,0x47539c,1],[6,0x8f7fb8,.6],[6.75,0xf5b9a2,.26],
  [8,0xffffff,0],[17,0xffffff,0],[18.75,0xf5a460,.26],[19.75,0x9070ac,.6],
  [21,0x47539c,1],[24,0x47539c,1]];
const PHASES = { dawn:6.75, day:12.5, dusk:18.75, night:23 };
function phaseOf(h) { return h < 5.25 || h >= 20.5 ? "night" : h < 7.75 ? "dawn" : h < 17.5 ? "day" : "dusk"; }
function mixRGB(a,b,t) { const ch=s=>Math.round(((a>>s)&255)+(((b>>s)&255)-((a>>s)&255))*t)<<s; return ch(16)|ch(8)|ch(0); }
function skyAt(hour) {
  const h=((hour%24)+24)%24; let i=1; while(i<SKY.length-1&&SKY[i][0]<h)i++;
  const [h0,c0,d0]=SKY[i-1],[h1,c1,d1]=SKY[i],t=(h-h0)/(h1-h0),s=t*t*(3-2*t);
  return {hour:h,phase:phaseOf(h),color:mixRGB(c0,c1,s),dark:d0+(d1-d0)*s};
}
const PREVIEW=(()=>{const q=new URLSearchParams(location.search),cycle=q.get("cycle");
  if(cycle!==null)return {cycle:Math.max(4,Number(cycle)||60)}; const time=q.get("time");
  if(time&&/^\d{1,2}(:\d{2})?$/.test(time)){const [h,m]=time.split(":");return {hour:(Number(h)+(Number(m)||0)/60)%24};}
  const phase=(q.get("phase")||"").toLowerCase(); return phase in PHASES?{hour:PHASES[phase]}:null;})();
const BOOT=Date.now();
function clockHour(){if(PREVIEW&&PREVIEW.cycle)return ((Date.now()-BOOT)/1000/PREVIEW.cycle%1)*24;
  if(PREVIEW)return PREVIEW.hour; const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;}
function hhmm(h){const m=Math.floor((h-Math.floor(h))*60);return String(Math.floor(h)).padStart(2,"0")+":"+String(m).padStart(2,"0");}

const PLACES = {
  library: {
    label: "the library",
    tx: 15, ty: 16, w: 3, h: 3,
    frame: { x: 256, y: 0, w: 48, h: 48 },
    accent: "#7fb0c8",
  },
};

const T = 16, MAPW = 32, MAPH = 22, ZOOM = 3;
const FLOOR_COLS = 22;
const GRASS = 11 * FLOOR_COLS + 3, GRASS2 = 11 * FLOOR_COLS + 2;
// dirt autotile block: cols 0-2 × rows 7-9 of the floor tileset (edges + center)
const DIRT_AT = (col, row) => row * FLOOR_COLS + col;
// flat ground clutter from TilesetNature — villagers walk over it
const DECOR = [[0,176],[16,176],[32,176],[48,176],[96,176],
               [112,176],[128,176],[144,176],[176,192]];
// solid props — each one blocks its tile, so paths route around it
const PROPS = [[0,160],[16,160],[32,160],[48,160],[64,160],[80,160],[96,160],
               [64,128],[80,128],[64,224],[80,224]];
const CROPS = [[144,144],[160,144],[128,160],[144,160]];   // garden vegetables
// villager house plots: [tileX, tileY], houses are 4×3 tiles, door bottom-center
const PLOTS = [[3,8],[8,8],[20,8],[25,8],[3,16],[8,16],[20,16],[25,16]];
const YOUR_HOUSE = { tx: 14, ty: 3 };   // 3×3 tiles, A-frame
// fenced kitchen gardens: [tileX, tileY, w, h]. The whole rect is solid ground;
// the inside is soil with crops, the border carries the picket fence.
const GARDENS = [[2,5,4,3],[8,5,4,3],[20,5,4,3],[26,5,4,3],[13,16,4,3]];
// picket runs along the street edge of each house row: [x0, x1, row].
// Door stubs punch gates through them, so every doorstep stays reachable.
const FENCE_RUNS = [[3,13,11],[18,28,11],[2,5,15],[9,12,15],[19,22,15],[26,29,15]];
const WALK_SPEED = 55;                  // px/s, native scale
const SKY_DEPTH=4000, LIGHT_DEPTH=4001;
// path costs: a road tile is cheaper than grass, so walks visibly prefer the
// street; turning costs a hair so paths come out straight instead of stair-stepped
const ROAD_COST = 10, GRASS_COST = 16, TURN_COST = 2;
// direction indices in the character sheets: columns = down, up, left, right
const D_DOWN = 0, D_UP = 1, D_LEFT = 2, D_RIGHT = 3;

// standing spots in front of a shared door: first arrival takes the middle, the
// rest fan out in a staggered arc so their name chips stay readable. Fixed, so
// nobody is nudged aside when a neighbour arrives or leaves.
const SLOT_SPOTS = [[0, 0], [-24, 14], [24, 14], [-48, 0], [48, 0], [0, 28]];
const SLOT_WRAP = 30;   // extra row offset once the arc is full

function plotDoor(i) {
  const [px, py] = PLOTS[i];
  return { x: px * T + 32, y: (py + 3) * T };
}
function placeDoor(name) {
  const p = PLACES[name];
  return { x: p.tx * T + p.w * T / 2, y: (p.ty + p.h) * T };
}
const yourDoor = { x: YOUR_HOUSE.tx * T + 24, y: (YOUR_HOUSE.ty + 3) * T };
const grid = fill => Array.from({ length: MAPH }, () => Array(MAPW).fill(fill));

/* Binary min-heap for A*: small, hand-rolled, no dependencies. */
class Heap {
  constructor() { this.node = []; this.f = []; }
  get size() { return this.node.length; }
  push(n, f) {
    let i = this.node.length;
    this.node.push(n); this.f.push(f);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.f[p] <= this.f[i]) break;
      this.swap(p, i); i = p;
    }
  }
  pop() {
    const top = this.node[0], last = this.node.length - 1;
    this.swap(0, last); this.node.pop(); this.f.pop();
    let i = 0;
    for (;;) {
      const l = i * 2 + 1, r = l + 1;
      let s = i;
      if (l < this.node.length && this.f[l] < this.f[s]) s = l;
      if (r < this.node.length && this.f[r] < this.f[s]) s = r;
      if (s === i) break;
      this.swap(s, i); i = s;
    }
    return top;
  }
  swap(a, b) {
    [this.node[a], this.node[b]] = [this.node[b], this.node[a]];
    [this.f[a], this.f[b]] = [this.f[b], this.f[a]];
  }
}

/* Two halves of one identity: `PLACE_OF_VERB` in projection.js decides which
 * place a villager belongs at, `PLACES` above decides where that place stands.
 * Nothing but the string joins them, so a typo or a one-sided rename would send
 * every researcher home and say nothing about it. Every projected name is
 * resolved through here, and the join is checked out loud at startup
 * (`reportPlaces`) and in tests/test_places.js. */
function placeOf(v) {
  return v.place && PLACES[v.place] ? v.place : null;
}
function unmappedPlaces() {
  return [...new Set(Object.values(PLACE_OF_VERB))].filter(id => !PLACES[id]);
}

// Which shared location a villager belongs at, if any: "door" is your doorstep,
// anything else is a key in PLACES. null means its own house.
function whereFor(v) {
  if (v.state === "knocking") return "door";
  const place = placeOf(v);
  if (place && (v.state === "working" || v.state === "stale")) return place;
  return null;
}

class Village extends Phaser.Scene {
  constructor() {
    super("village");
    this.viz = new Map();
    this.plotOf = new Map();
    this.slots = new Map();   // shared location → [agent id per slot, null = free]
  }

  preload() {
    this.load.image("floor",  "/assets/tilesets/TilesetFloor.png");
    this.load.image("houses", "/assets/tilesets/TilesetHouse.png");
    this.load.image("nature", "/assets/tilesets/TilesetNature.png");
    this.load.image("shadow", "/assets/shadow.png");
    for (const c of CHARS) {
      this.load.spritesheet(c + "-walk", "/assets/characters/" + c + "-walk.png",
                            { frameWidth: 16, frameHeight: 16 });
      this.load.spritesheet(c + "-idle", "/assets/characters/" + c + "-idle.png",
                            { frameWidth: 16, frameHeight: 16 });
    }
  }

  create() {
    this.cameras.main.setZoom(ZOOM);
    this.cameras.main.centerOn(MAPW * T / 2, MAPH * T / 2);
    // named frames for prefab buildings and trees
    const houses = this.textures.get("houses");
    for (let i = 0; i < 4; i++) houses.add("h" + i, 0, i * 64, 0, 64, 48);
    houses.add("yours", 0, 416, 0, 48, 48);
    for (const [name, p] of Object.entries(PLACES))
      houses.add("place-" + name, 0, p.frame.x, p.frame.y, p.frame.w, p.frame.h);
    // picket fence cut out of the enclosure prefab: the horizontal run repeats
    // every 16 px and the vertical rail every 16 px, plus a post cap at each end
    houses.add("fenceH", 0, 161, 162, 16, 14);
    houses.add("fenceL", 0, 150, 162, 11, 14);
    houses.add("fenceR", 0, 207, 162, 12, 14);
    houses.add("fenceV", 0, 150, 178,  4, 16);
    const nature = this.textures.get("nature");
    nature.add("tree0", 0, 0, 0, 32, 32);
    nature.add("tree1", 0, 32, 0, 32, 32);
    DECOR.forEach(([x, y], i) => nature.add("d" + i, 0, x, y, 16, 16));
    PROPS.forEach(([x, y], i) => nature.add("p" + i, 0, x, y, 16, 16));
    CROPS.forEach(([x, y], i) => nature.add("c" + i, 0, x, y, 16, 16));

    // walkability is derived from the terrain: every builder marks what it covers
    this.blocked = grid(false);
    this.buildGround();
    this.buildBuildings();
    this.buildTrees();
    this.buildFences();
    this.buildDecor();
    this.buildSky();
    this.reportMap();
    this.reportPlaces();

    for (const c of CHARS) {
      for (const d of [D_DOWN, D_UP, D_LEFT, D_RIGHT]) {
        this.anims.create({
          key: c + "-walk-" + d,
          frames: this.anims.generateFrameNumbers(c + "-walk",
                    { frames: [d, d + 4, d + 8, d + 12] }),
          frameRate: 8, repeat: -1,
        });
      }
    }

    this.input.on("gameobjectdown", (_p, obj) => {
      if (obj.getData("agent")) openPanel(obj.getData("agent"));
    });
    this.events.on("update", () => {
      for (const v of this.viz.values()) {
        v.cont.setDepth(v.cont.y);
        v.chip.wx = v.cont.x;
        v.chip.wy = v.cont.y - 11;
        // self-check: a villager standing on solid ground would be a lie
        const t = this.tileAt(v.cont.x, v.cont.y);
        if (!this.walkable(t.x, t.y)) this.offRoute++;
      }
      this.layoutChips();
      this.applySky();
    });
  }

  buildSky() {
    this.sky=this.add.rectangle(0,0,MAPW*T,MAPH*T,0xffffff).setOrigin(0,0)
      .setDepth(SKY_DEPTH).setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.skyState=null; this.applySky();
  }

  applySky() {
    const sky=skyAt(clockHour()); this.sky.setFillStyle(sky.color,1);
    for(const viz of this.viz.values()) {
      if(viz.state==="stale") viz.cont.setAlpha(.45+.15*sky.dark);
      if(viz.plot>=0) {
        const light=BurrowPresence.houseLight(viz);
        this.glows[viz.plot].setVisible(light.home).setAlpha(light.working?.55+.4*sky.dark:.3*sky.dark);
      }
    }
    if(this.knockGlow) this.knockGlow.setVisible(this.knockers>0).setAlpha(.2+.5*sky.dark);
    if(!this.skyState||this.skyState.color!==sky.color||Math.abs(this.skyState.hour-sky.hour)>.02) renderSky(sky);
    this.skyState=sky;
  }

  /* ————— terrain ————— */

  block(x, y) {
    if (x >= 0 && y >= 0 && x < MAPW && y < MAPH) this.blocked[y][x] = true;
  }

  buildGround() {
    const dirt = grid(false), soil = grid(false);
    const mark = (x0, x1, y0, y1) => {
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) dirt[y][x] = true;
    };
    mark(2, 29, 12, 14);                       // main street
    mark(14, 17, 6, 11);                       // lane from your door to the street
    mark(12, 19, 6, 8);                        // plaza at your door
    for (const [px, py] of PLOTS) mark(px + 1, px + 2, py + 3, py + 3); // door stubs
    for (const p of Object.values(PLACES)) {          // lane off the street, then
      const doorRow = p.ty + p.h, lane = p.tx - 2;    // an apron at the door
      mark(lane, lane, 15, doorRow);
      mark(lane, p.tx + p.w + 1, doorRow, doorRow + 1);
    }
    for (const [gx, gy, gw, gh] of GARDENS) {
      for (let y = gy; y < gy + gh; y++)
        for (let x = gx; x < gx + gw; x++) this.block(x, y);
      for (let y = gy + 1; y < gy + gh; y++)
        for (let x = gx + 1; x < gx + gw - 1; x++) soil[y][x] = true;
    }
    this.dirt = dirt;
    this.soil = soil;
    const earth = (x, y) => dirt[y][x] || soil[y][x];
    const rows = [];
    for (let y = 0; y < MAPH; y++) {
      const row = [];
      for (let x = 0; x < MAPW; x++) {
        if (soil[y][x]) { row.push(DIRT_AT(1, 8)); continue; }  // tilled bed, fenced in
        if (!earth(x, y)) {
          row.push(hashCode(x + "," + y) % 11 === 0 ? GRASS2 : GRASS);
          continue;
        }
        const gN = y > 0 && !earth(x, y - 1), gS = y < MAPH - 1 && !earth(x, y + 1);
        const gW = x > 0 && !earth(x - 1, y), gE = x < MAPW - 1 && !earth(x + 1, y);
        const col = gW && !gE ? 0 : gE && !gW ? 2 : 1;
        const r   = gN && !gS ? 7 : gS && !gN ? 9 : 8;
        row.push(DIRT_AT(col, r));
      }
      rows.push(row);
    }
    const map = this.make.tilemap({ data: rows, tileWidth: T, tileHeight: T });
    map.createLayer(0, map.addTilesetImage("floor"), 0, 0).setDepth(-10);
  }

  buildDecor() {
    // doorsteps, the knock queue and the tiles around them stay clear of props
    const clear = new Set();
    const reserve = (x, y) => {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) clear.add((x + dx) + "," + (y + dy));
    };
    for (const p of Object.values(PLACES))
      for (let y = p.ty - 1; y <= p.ty + p.h; y++)
        for (let x = p.tx - 1; x <= p.tx + p.w; x++) clear.add(x + "," + y);
    for (const [px, py] of PLOTS) { reserve(px + 1, py + 3); reserve(px + 2, py + 3); }
    for (let y = 6; y <= 8; y++) for (let x = 12; x <= 19; x++) reserve(x, y);
    // the lane behind the lower houses is the only way to their doors: keep it clear
    for (let y = 15; y <= 19; y++) for (let x = 0; x < MAPW; x++) clear.add(x + "," + y);
    for (let y = 1; y < MAPH - 1; y++) {
      for (let x = 1; x < MAPW - 1; x++) {
        if (this.blocked[y][x] || this.dirt[y][x]) continue;
        const h = hashCode(y + ":" + x);
        if (h % 5 === 0) {
          this.add.image(x * T + 8, y * T + 16, "nature", "d" + ((h >> 4) % DECOR.length))
            .setOrigin(.5, 1).setDepth(0);
        } else if (h % 11 === 0 && !clear.has(x + "," + y) && this.tryBlock(x, y)) {
          this.add.image(x * T + 8, y * T + 16, "nature", "p" + ((h >> 4) % PROPS.length))
            .setOrigin(.5, 1).setDepth(y * T + 16);
        }
      }
    }
  }

  // Block a tile only if it costs the village exactly that one tile — a bush is
  // never allowed to wall a villager off from its door.
  tryBlock(x, y) {
    const before = this.reachable();
    this.blocked[y][x] = true;
    if (this.reachable() === before - 1) return true;
    this.blocked[y][x] = false;
    return false;
  }

  // how many tiles you can walk to from the main street
  reachable() {
    if (this.blocked[13][15]) return 0;
    const seen = new Uint8Array(MAPW * MAPH);
    const seed = 13 * MAPW + 15;   // middle of the main street
    const stack = [seed];
    seen[seed] = 1;
    let n = 0;
    while (stack.length) {
      const i = stack.pop(), cx = i % MAPW, cy = (i / MAPW) | 0;
      n++;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= MAPW || ny >= MAPH) continue;
        const ni = ny * MAPW + nx;
        if (seen[ni] || this.blocked[ny][nx]) continue;
        seen[ni] = 1; stack.push(ni);
      }
    }
    return n;
  }

  // no walkable tile is walled off from the street
  connected() {
    let open = 0;
    for (let y = 0; y < MAPH; y++)
      for (let x = 0; x < MAPW; x++) if (!this.blocked[y][x]) open++;
    return this.reachable() === open;
  }

  buildFences() {
    const gates = new Set();
    for (const [px, py] of PLOTS) {
      gates.add((px + 1) + "," + (py + 3));
      gates.add((px + 2) + "," + (py + 3));
    }
    for (const [x0, x1, row] of FENCE_RUNS) {
      let run = [];
      const flush = () => {
        if (run.length) this.fenceRun(run[0], run[run.length - 1], row);
        run = [];
      };
      for (let x = x0; x <= x1; x++) {
        if (gates.has(x + "," + row)) { flush(); continue; }
        this.block(x, row);
        run.push(x);
      }
      flush();
    }
    for (const [gx, gy, gw, gh] of GARDENS) {
      this.fenceRun(gx, gx + gw - 1, gy);
      this.fenceRun(gx, gx + gw - 1, gy + gh - 1);
      for (let r = gy; r < gy + gh; r++) {
        this.add.image(gx * T + 5, r * T, "houses", "fenceV")
          .setOrigin(0, 0).setDepth((r + 1) * T + 2);
        this.add.image((gx + gw - 1) * T + 7, r * T, "houses", "fenceV")
          .setOrigin(0, 0).setDepth((r + 1) * T + 2);
      }
      // one row of vegetables, so the soil and the front fence both stay visible
      for (let x = gx + 1; x < gx + gw - 1; x++) {
        const h = hashCode("crop" + x + ":" + gy);
        this.add.image(x * T + 8, (gy + 2) * T, "nature", "c" + (h % CROPS.length))
          .setOrigin(.5, 1).setDepth((gy + 1) * T + 8);
      }
    }
  }

  fenceRun(x0, x1, row) {
    const y = (row + 1) * T;
    for (let x = x0; x <= x1; x++)
      this.add.image(x * T, y, "houses", "fenceH").setOrigin(0, 1).setDepth(y);
    this.add.image(x0 * T, y, "houses", "fenceL").setOrigin(1, 1).setDepth(y + 1);
    this.add.image((x1 + 1) * T, y, "houses", "fenceR").setOrigin(0, 1).setDepth(y + 1);
  }

  buildBuildings() {
    this.glows = [];
    PLOTS.forEach(([px, py], i) => {
      this.add.image(px * T, py * T, "houses", "h" + (i % 4))
        .setOrigin(0, 0).setDepth((py + 3) * T);
      for (let y = py; y < py + 3; y++)
        for (let x = px; x < px + 4; x++) this.block(x, y);
      // warm light in the doorway while its agent works — off otherwise
      const g = this.add.rectangle(px * T + 32, (py + 3) * T - 9, 10, 14, 0xffc86b, .55)
        .setDepth(LIGHT_DEPTH).setVisible(false);
      this.glows.push(g);
    });
    this.add.image(YOUR_HOUSE.tx * T, YOUR_HOUSE.ty * T, "houses", "yours")
      .setOrigin(0, 0).setDepth((YOUR_HOUSE.ty + 3) * T);
    for (let y = YOUR_HOUSE.ty; y < YOUR_HOUSE.ty + 3; y++)
      for (let x = YOUR_HOUSE.tx; x < YOUR_HOUSE.tx + 3; x++) this.block(x, y);
    this.knockers=0;
    this.knockGlow=this.add.rectangle(yourDoor.x,yourDoor.y-8,32,24,0xff8f5e,.4)
      .setDepth(LIGHT_DEPTH).setVisible(false);
    this.chips = [];
    this.makeChip(null, "#ffc86b", yourDoor.x, YOUR_HOUSE.ty * T - 2, "you")
      .el.classList.add("you");
    // shared locations: building, name label, and a doorway lit only while
    // somebody is genuinely there
    this.placeGlow = {};
    for (const [name, p] of Object.entries(PLACES)) {
      const d = placeDoor(name);
      this.add.image(p.tx * T, p.ty * T, "houses", "place-" + name)
        .setOrigin(0, 0).setDepth(d.y);
      this.placeGlow[name] = this.add.rectangle(d.x, d.y - 9, 12, 14, 0xffc86b, .5)
        .setDepth(LIGHT_DEPTH).setVisible(false);
      this.makeChip(null, p.accent, d.x, p.ty * T - 2, p.label)
        .el.classList.add("place");
    }
  }

  makeChip(id, accent, wx, wy, name, sub) {
    const el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = `<span class="dot" style="background:${accent}"></span><span class="nm"></span><span class="sub"></span>`;
    el.querySelector(".nm").textContent = name;
    el.querySelector(".sub").textContent = sub || "";
    if (!sub) el.querySelector(".sub").style.display = "none";
    if (id) el.addEventListener("click", () => openPanel(id));
    document.getElementById("labels").appendChild(el);
    const chip = { el, wx, wy };
    this.chips.push(chip);
    return chip;
  }

  layoutChips() {
    const rect = this.game.canvas.getBoundingClientRect();
    const s = rect.width / (MAPW * T * ZOOM);
    for (const c of this.chips) {
      c.el.style.left = (rect.left + c.wx * ZOOM * s) + "px";
      c.el.style.top  = (rect.top  + c.wy * ZOOM * s) + "px";
    }
  }

  buildTrees() {
    // a tree is 32×32 with its base at (x, y): the ground it stands on is solid,
    // which is what makes the border trees a wall villagers have to route around
    const tree = (x, y, i) => {
      this.add.image(x, y, "nature", "tree" + (i % 2)).setOrigin(.5, 1).setDepth(y);
      for (let ty = Math.floor((y - 32) / T); ty <= Math.ceil(y / T) - 1; ty++)
        for (let tx = Math.floor((x - 16) / T); tx <= Math.ceil((x + 16) / T) - 1; tx++)
          this.block(tx, ty);
    };
    for (let i = 0; i < MAPW / 2; i++) {
      tree(i * 32 + 16, 34, i);
      tree(i * 32 + 16, MAPH * T, i + 1);
    }
    for (let i = 2; i < 10; i++) {
      tree(16, i * 32 + 2, i);
      tree(MAPW * T - 16, i * 32 + 2, i + 1);
    }
    tree(13 * T, 4 * T, 0); tree(19 * T, 4 * T, 1);   // accents flanking your house
  }

  /* ————— pathfinding ————— */

  walkable(x, y) {
    return x >= 0 && y >= 0 && x < MAPW && y < MAPH && !this.blocked[y][x];
  }
  tileAt(x, y) {
    return { x: Phaser.Math.Clamp(Math.floor(x / T), 0, MAPW - 1),
             y: Phaser.Math.Clamp(Math.floor(y / T), 0, MAPH - 1) };
  }
  tileCost(x, y) { return this.dirt[y][x] ? ROAD_COST : GRASS_COST; }

  // nearest walkable tile, breadth-first — used when a spot lands on solid ground
  nearestWalkable(x, y) {
    const seen = new Uint8Array(MAPW * MAPH);
    const q = [[x, y]];
    seen[y * MAPW + x] = 1;
    for (let i = 0; i < q.length; i++) {
      const [cx, cy] = q[i];
      if (this.walkable(cx, cy)) return { x: cx, y: cy };
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= MAPW || ny >= MAPH) continue;
        if (seen[ny * MAPW + nx]) continue;
        seen[ny * MAPW + nx] = 1;
        q.push([nx, ny]);
      }
    }
    return null;
  }

  // A* over the walkability map, 4-way (the sprites only face 4 ways).
  // Roads cost less than grass, so a walk takes the street when the detour is
  // reasonable; turning costs a little, so paths come out straight.
  findPath(sx, sy, gx, gy) {
    if (!this.walkable(sx, sy)) {
      const n = this.nearestWalkable(sx, sy);
      if (!n) return null;
      sx = n.x; sy = n.y;
    }
    if (!this.walkable(gx, gy)) {
      const n = this.nearestWalkable(gx, gy);
      if (!n) return null;
      gx = n.x; gy = n.y;
    }
    const N = MAPW * MAPH, start = sy * MAPW + sx, goal = gy * MAPW + gx;
    if (start === goal) return [{ x: sx, y: sy }];
    // The incoming direction is part of the A* state: reaching the same tile
    // from different sides can change the cost of every route that follows.
    const STATES = 5, NO_DIR = 4;
    const startState = start * STATES + NO_DIR;
    const g = new Float64Array(N * STATES).fill(Infinity);
    const from = new Int32Array(N * STATES).fill(-1);
    const done = new Uint8Array(N * STATES);
    const h = (x, y) => ROAD_COST * (Math.abs(x - gx) + Math.abs(y - gy));
    const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
    const open = new Heap();
    g[startState] = 0;
    open.push(startState, h(sx, sy));
    let goalState = -1;
    while (open.size) {
      const cur = open.pop();
      if (done[cur]) continue;
      done[cur] = 1;
      const tile = (cur / STATES) | 0;
      if (tile === goal) { goalState = cur; break; }
      const incoming = cur % STATES;
      const cx = tile % MAPW, cy = (tile / MAPW) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (!this.walkable(nx, ny)) continue;
        const ni = (ny * MAPW + nx) * STATES + d;
        if (done[ni]) continue;
        const cost = this.tileCost(nx, ny) +
                     (incoming !== NO_DIR && incoming !== d ? TURN_COST : 0);
        if (g[cur] + cost >= g[ni]) continue;
        g[ni] = g[cur] + cost;
        from[ni] = cur;
        open.push(ni, g[ni] + h(nx, ny));
      }
    }
    if (goalState < 0) return null;
    const path = [];
    for (let i = goalState; i >= 0; i = from[i]) {
      const tile = (i / STATES) | 0;
      path.push({ x: tile % MAPW, y: (tile / MAPW) | 0 });
      if (i === startState) break;
    }
    return path.reverse();
  }

  // pixel waypoints for a walk: tile centres along the path, collinear runs
  // collapsed into one leg, ending exactly on the spot the villager is headed for
  route(fromX, fromY, toX, toY) {
    const s = this.tileAt(fromX, fromY), e = this.tileAt(toX, toY);
    const tiles = this.findPath(s.x, s.y, e.x, e.y);
    if (!tiles) return null;
    const pts = tiles.slice(1).map(t => ({ x: t.x * T + T / 2, y: t.y * T + T / 2 }));
    pts.push({ x: toX, y: toY });
    const out = [];
    let prev = { x: fromX, y: fromY };
    for (let i = 0; i < pts.length; i++) {
      const cur = pts[i], next = pts[i + 1];
      if (next && ((prev.x === cur.x && cur.x === next.x) ||
                   (prev.y === cur.y && cur.y === next.y))) continue;
      out.push(cur);
      prev = cur;
    }
    return out;
  }

  // every doorstep, work spot and knock slot the projection can ask for
  spots() {
    const out = [];
    PLOTS.forEach((_p, i) => {
      const d = plotDoor(i);
      out.push({ name: "plot " + i + " rest", x: d.x, y: d.y + 2 });
      out.push({ name: "plot " + i + " work", x: d.x, y: d.y + 14 });
    });
    for (let s = 0; s < 8; s++)
      out.push({ name: "knock " + s, x: yourDoor.x + (s % 4) * 26 - 39,
                 y: yourDoor.y + 10 + Math.floor(s / 4) * 16 });
    for (let i = 0; i < 14; i++)
      out.push({ name: "street " + i, x: 48 + i * 28, y: 13 * T + 8 });
    return out;
  }

  // Every spot must stand on open ground and every walk between two spots must
  // stay on it. Cheap enough to run on load; `village.checkMap()` re-runs it.
  checkMap() {
    const spots = this.spots(), bad = [];
    for (const s of spots) {
      const t = this.tileAt(s.x, s.y);
      if (!this.walkable(t.x, t.y)) bad.push(s.name + ": stands on solid ground");
    }
    for (const a of spots) {
      for (const b of spots) {
        if (a === b) continue;
        const ta = this.tileAt(a.x, a.y), tb = this.tileAt(b.x, b.y);
        const path = this.findPath(ta.x, ta.y, tb.x, tb.y);
        if (!path) { bad.push(a.name + " → " + b.name + ": no path"); continue; }
        for (const t of path)
          if (!this.walkable(t.x, t.y))
            bad.push(a.name + " → " + b.name + ": crosses " + t.x + "," + t.y);
      }
    }
    let open = 0, road = 0;
    for (let y = 0; y < MAPH; y++)
      for (let x = 0; x < MAPW; x++)
        if (!this.blocked[y][x]) { open++; if (this.dirt[y][x]) road++; }
    return { tiles: MAPW * MAPH, walkable: open, road, spots: spots.length,
             connected: this.connected(), offRoute: this.offRoute, problems: bad };
  }

  /* A place the projection can name but the map cannot draw is the bug this
     whole change exists to fix, and its symptom — a villager quietly standing
     at home — looks like nothing at all. Say it loudly instead. */
  reportPlaces() {
    const missing = unmappedPlaces();
    if (!missing.length) return;
    const msg = "burrow places: the projection sends villagers to " +
                missing.join(", ") + ", which the map has no building for";
    console.error(msg);
    const foot = document.querySelector("footer");
    if (foot) foot.textContent += " · ⚠ " + msg;
  }

  reportMap() {
    this.offRoute = 0;
    const r = this.checkMap();
    const line = `burrow map: ${r.walkable}/${r.tiles} tiles walkable ` +
                 `(${r.road} road), ${r.spots} spots all reachable`;
    if (r.problems.length) console.error("burrow map problems:", r.problems);
    else console.log(line);
  }

  text(x, y, str, color, size) {
    // rendered at 3× and drawn at ⅓: crisp at ZOOM, and unlike setResolution()
    // it survives the WebGL renderer, where the "!" was coming out as a smudge
    return this.add.text(x, y, str, {
      fontFamily: "VT323", fontSize: (size || 8) * 3 + "px", color,
    }).setOrigin(.5, 1).setScale(1 / 3).setDepth(9000)
      .setShadow(0, 3, "#000000", 0, true, true);
  }

  /* ————— villagers ————— */

  assignPlot(id) {
    if (this.plotOf.has(id)) return this.plotOf.get(id);
    const used = new Set(this.plotOf.values());
    for (let i = 0; i < PLOTS.length; i++)
      if (!used.has(i)) { this.plotOf.set(id, i); return i; }
    this.plotOf.set(id, -1);   // village is full: traveler without a house
    return -1;
  }

  /* A shared location hands out stable slots: a villager keeps the spot it took
     for as long as it stays, so nobody shuffles sideways because a neighbour
     arrived or left — that would be movement no event asked for. */
  slotAt(where, id) {
    let taken = this.slots.get(where);
    if (!taken) { taken = []; this.slots.set(where, taken); }
    const mine = taken.indexOf(id);
    if (mine >= 0) return mine;
    const free = taken.indexOf(null);
    if (free >= 0) { taken[free] = id; return free; }
    return taken.push(id) - 1;
  }

  leaveSlots(id, except) {
    for (const [where, taken] of this.slots) {
      if (where === except) continue;
      const at = taken.indexOf(id);
      if (at >= 0) taken[at] = null;
    }
  }

  spotFor(v, viz, where, slot) {
    if (where && where !== "door") {   // working at a shared building
      const p = PLACES[where], d = placeDoor(where);
      const [dx, dy] = SLOT_SPOTS[slot % SLOT_SPOTS.length];
      return { x: d.x + dx,
               y: d.y + 6 + dy + Math.floor(slot / SLOT_SPOTS.length) * SLOT_WRAP,
               approachX: (p.tx - 2) * T + T / 2,
               kind: where };
    }
    if (viz.plot < 0) {   // traveler rests/works on the street
      const rx = 48 + (hashCode(viz.id) % 14) * 28;
      if (v.state === "knocking") { /* fall through to door */ }
      else return { x: rx, y: 13 * T + 8, kind: v.state };
    }
    const door = viz.plot >= 0 ? plotDoor(viz.plot) : null;
    switch (v.state) {
      case "knocking": return { x: yourDoor.x + (slot % 4) * 26 - 39,
                                y: yourDoor.y + 10 + Math.floor(slot / 4) * 16,
                                kind: "knocking" };
      case "working":  return { x: door.x, y: door.y + 14, kind: "working" };
      default:         return { x: door.x, y: door.y + 2,  kind: "resting" };
    }
  }

  spawn(v) {
    const plot = this.assignPlot(v.id);
    const door = plot >= 0 ? plotDoor(plot) : { x: 48 + (hashCode(v.id) % 14) * 28, y: 13 * T + 8 };
    const cont = this.add.container(door.x, door.y + 2);
    const shadow = this.add.image(0, 7, "shadow").setAlpha(.35);
    const spr = this.add.sprite(0, 0, v.char + "-idle", D_DOWN);
    // knock "!" and sleep "z" live above the day/night overlay and follow the
    // container from the update loop: state must not dim just because it's night
    const bang = this.text(cont.x + 9, cont.y - 5, "!", "#ff8f5e", 10)
      .setDepth(LIGHT_DEPTH).setVisible(false);
    const zzz  = this.text(cont.x + 6, cont.y - 6, "z", "#cfc7ae", 8)
      .setDepth(LIGHT_DEPTH).setVisible(false);
    cont.add([shadow, spr]);
    cont.setSize(14, 16).setInteractive({ useHandCursor: true });
    cont.setData("agent", v.id);
    spr.setData("agent", v.id);
    const chip = this.makeChip(v.id, v.accent, cont.x, cont.y - 11, v.name, v.project);
    const viz = { id: v.id, cont, spr, bang, zzz, chip, plot, char: v.char,
                  state: v.state, lastTs: 0, target: null, walk: null,
                  home: BurrowPresence.atHome(v.state, placeOf(v)) };
    this.viz.set(v.id, viz);
    return viz;
  }

  despawn(id) {
    const viz = this.viz.get(id);
    if (!viz) return;
    if (viz.walk) viz.walk.destroy();
    viz.chip.el.remove();
    this.chips = this.chips.filter(c => c !== viz.chip);
    viz.cont.destroy();
    this.leaveSlots(id, null);
    this.viz.delete(id);
    this.plotOf.delete(id);
  }

  walkTo(viz, target, targetY, arrivesHome) {
    if (viz.walk) { viz.walk.destroy(); viz.walk = null; }
    const c = viz.cont, char = viz.spr.texture.key.replace("-idle", "").replace("-walk", "");
    const tx = typeof target === "object" ? target.x : target;
    const ty = typeof target === "object" ? target.y : targetY;
    if (typeof target === "object") arrivesHome = targetY;
    BurrowPresence.startJourney(viz, Boolean(arrivesHome));
    let path = this.route(c.x, c.y, tx, ty);
    if (!path) {
      // Staying put is truthful. A straight fallback could cross solid terrain
      // and show the villager somewhere it could never have walked.
      console.error("burrow invariant: no walkable path to", tx, ty);
      viz.spr.stop();
      viz.spr.setTexture(char + "-idle", D_DOWN);
      return false;
    }
    const legs = [];
    let px = c.x, py = c.y;
    for (const p of path) {
      const dx = p.x - px, dy = p.y - py;
      const dist = Math.hypot(dx, dy);
      if (dist < 1) continue;
      const d = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? D_RIGHT : D_LEFT)
                                             : (dy > 0 ? D_DOWN : D_UP);
      legs.push({
        x: p.x, y: p.y, duration: dist / WALK_SPEED * 1000,
        onStart: () => viz.spr.play(char + "-walk-" + d, true),
      });
      px = p.x; py = p.y;
    }
    const settle = () => {
      viz.spr.stop();
      viz.spr.setTexture(char + "-idle", D_DOWN);
      viz.walk = null;
      BurrowPresence.finishJourney(viz, Boolean(arrivesHome));
    };
    if (!legs.length) { settle(); return true; }
    viz.walk = this.tweens.chain({ targets: c, tweens: legs, onComplete: settle });
    return true;
  }

  hop(viz) {   // one real event just arrived → one small hop; never loops
    this.tweens.add({ targets: viz.spr, y: -3, duration: 110, yoyo: true });
  }

  updateVillage(list) {
    const seen = new Set();
    const busyPlaces = new Set();
    let knockers = 0;
    for (const v of list) {
      seen.add(v.id);
      let viz = this.viz.get(v.id);
      const isNew = !viz;
      if (isNew) viz = this.spawn(v);

      viz.chip.el.className = "chip " + v.state;
      viz.chip.el.querySelector(".nm").textContent = v.name;
      viz.chip.el.querySelector(".dot").style.background = v.accent;
      if (!isNew && v.char !== viz.char) {   // soul file edited → new sprite
        viz.spr.stop();
        viz.spr.setTexture(v.char + "-idle", D_DOWN);
      }
      viz.char = v.char;
      const sub = viz.chip.el.querySelector(".sub");
      const subText =
        v.state === "knocking" ? "needs you!" :
        v.state === "stale"    ? v.project + " · no signal" :
        v.state === "working" && v.doing ? v.project + " · " + v.doing : v.project;
      sub.textContent = subText;
      sub.style.display = "";

      if (!isNew && v.lastTs > viz.lastTs && v.state === "working") this.hop(viz);
      viz.lastTs = v.lastTs;

      const where = whereFor(v);
      this.leaveSlots(v.id, where);
      const slot = where ? this.slotAt(where, v.id) : 0;
      if (where && where !== "door" && v.state === "working") busyPlaces.add(where);
      if (v.state === "knocking") knockers++;
      const spot = this.spotFor(v, viz, where, slot);
      const moved = !viz.target || viz.target.x !== spot.x || viz.target.y !== spot.y;
      if (isNew) {
        viz.cont.setPosition(spot.x, spot.y);
        viz.target = spot;
        viz.spr.setTexture(v.char + "-idle", D_DOWN);
      } else if (moved || v.state !== viz.state) {
        viz.target = spot;
        this.walkTo(viz, spot, BurrowPresence.atHome(v.state, placeOf(v)));
      }
      viz.state = v.state;

      const stale = v.state === "stale";
      viz.cont.setAlpha(stale ? .45 : 1);
      viz.bang.setVisible(v.state === "knocking");
      viz.zzz.setVisible(v.state === "resting");
    }
    for (const name of Object.keys(PLACES))
      this.placeGlow[name].setVisible(busyPlaces.has(name));
    for (const id of [...this.viz.keys()])
      if (!seen.has(id)) this.despawn(id);
    this.knockers=knockers;
    this.applySky();
  }
}

/* ————— DOM chrome: census, panel, live event transport ————— */

const censusEl  = document.getElementById("census");
const beatEl    = document.getElementById("lastbeat");
const emptyEl   = document.getElementById("empty");
const panelEl   = document.getElementById("panel");
const panelBody = document.getElementById("panel-body");

let villagers = [];
let selectedId = null;
let scene = null;

function renderChrome(now) {
  emptyEl.style.display = villagers.length ? "none" : "block";
  const knockers = villagers.filter(v => v.state === "knocking").length;
  const working  = villagers.filter(v => v.state === "working").length;
  const resting  = villagers.filter(v => v.state === "resting").length;
  const parts = [`${villagers.length} villager${villagers.length === 1 ? "" : "s"}`];
  if (working) parts.push(`${working} working`);
  if (resting) parts.push(`${resting} resting`);
  censusEl.innerHTML = parts.join('<span class="dot"> · </span>') +
    (knockers ? `<span class="dot"> · </span><span class="attn">${knockers} at your door</span>` : "");
  const newest = Math.max(0, ...villagers.map(v => v.lastTs));
  beatEl.textContent = newest ? "last signal " + ago(newest, now) : "";
  if (selectedId) renderPanel(now);
}

const previewEl = document.getElementById("preview");
const PAGE_BG = [0x14, 0x23, 0x17];   // the letterboxed area around the village

/* the DOM half of the daylight projection: page background, a `data-phase` hook,
   and — only when the clock is overridden — a badge that says so out loud */
function renderSky(sky) {
  const bg = PAGE_BG.map((c, i) => Math.round(c * ((sky.color >> (16 - i * 8)) & 255) / 255));
  document.body.style.background = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  document.body.dataset.phase = sky.phase;
  document.body.dataset.clock = hhmm(sky.hour);
  if (!PREVIEW) { previewEl.hidden = true; return; }
  previewEl.hidden = false;
  previewEl.innerHTML = `preview: ${esc(sky.phase)} · ${hhmm(sky.hour)}` +
    `<span class="note">dev override — not the real clock</span>`;
}

function openPanel(id) { selectedId = id; renderPanel(Date.now()); }
function renderPanel(now) {
  const v = villagers.find(x => x.id === selectedId);
  if (!v) { closePanel(); return; }
  const at = placeOf(v) ? " · at " + PLACES[v.place].label : "";
  const stateText =
    v.state === "knocking" ? "at your door — needs you" :
    v.state === "working"  ? (v.doing || "working") + at :
    v.state === "stale"    ? "no signal for a while" + at : "resting";
  const cls = v.state === "knocking" ? "attn" : v.state === "working" ? "busy" : "";
  panelBody.innerHTML = `
    <h2><span style="color:${v.accent}">▪</span> ${esc(v.name)}</h2>
    ${v.soul && v.soul.meta.role ? `<div class="meta role">${esc(v.soul.meta.role)}</div>` : ""}
    <div class="meta">${esc(v.project)} · ${esc(v.cwd)}</div>
    <div class="meta">${esc(v.id)}</div>
    <div class="state-line ${cls}">${esc(stateText)}</div>
    ${v.knock ? `
      <div class="knock">
        <div class="knock-h">needs you</div>
        <div class="knock-msg">${esc(v.knock.message)}</div>
        <div class="knock-when">knocked ${ago(v.knock.ts, now)}</div>
      </div>` : ""}
    ${v.soul && v.soul.body ? `<div class="soul">${esc(v.soul.body)}</div>` : ""}
    ${v.events.slice().reverse().map(ev => `
      <div class="evt t-${esc(ev.type)}">
        <div class="when">${ago(Date.parse(ev.ts) || 0, now)} · ${esc(ev.type)}</div>
        <div class="what">${esc(describe(ev))}</div>
      </div>`).join("")}`;
  panelEl.classList.add("open");
}
function closePanel() { selectedId = null; panelEl.classList.remove("open"); }
panelEl.querySelector(".close").addEventListener("click", closePanel);

let souls = [];
let eventCursor = 0;
let agents = new Map();
let pollPromise = null;
let eventStream = null;
let streamReady = false;
let reconnectTimer = null;

function project(lines, reset = false) {
  if (reset) agents = new Map();
  foldEvents(agents, lines);
  const now = Date.now();
  villagers = reduce(agents, now, souls);
  if (scene && scene.scene.isActive()) scene.updateVillage(villagers);
  renderChrome(now);
}

function poll() {
  if (pollPromise) return pollPromise;
  if (eventStream || streamReady) return Promise.resolve();
  pollPromise = (async () => {
    try {
    const [evRes, soulRes] = await Promise.all([
      fetch("/events?since=" + eventCursor, { cache: "no-store" }),
      fetch("/villagers", { cache: "no-store" }).catch(() => null),
    ]);
    if (!evRes.ok) throw new Error("events request failed");
    const text = await evRes.text();
    const reset = evRes.headers.get("X-Burrow-Reset") === "1";
    const lines = text.split("\n").filter(Boolean);
    // Preserve the old first-load behavior: bootstrap from at most 4,000 events.
    project(eventCursor === 0 || reset ? lines.slice(-4000) : lines, reset);
    eventCursor = evRes.headers.get("X-Burrow-Cursor") || 0;
    if (soulRes && soulRes.ok) { try { souls = await soulRes.json(); } catch {} }
    // Souls affect names and appearance even when there are no new events.
    project([]);
    } catch {
      beatEl.textContent = "server unreachable";
    }
  })().finally(() => { pollPromise = null; });
  return pollPromise;
}

function connectStream() {
  if (eventStream || typeof EventSource === "undefined") return;
  const stream = new EventSource("/events/stream?since=" + encodeURIComponent(eventCursor));
  eventStream = stream;
  stream.onopen = () => { streamReady = true; };
  stream.onmessage = message => {
    streamReady = true;
    if (message.lastEventId) eventCursor = message.lastEventId;
    project([message.data]);
  };
  stream.addEventListener("reset", () => {
    eventCursor = 0;
    project([], true);
  });
  stream.onerror = async () => {
    stream.close();
    if (eventStream === stream) eventStream = null;
    streamReady = false;
    beatEl.textContent = "live stream interrupted — polling";
    // Finish the cursor catch-up before opening another stream, otherwise a slow
    // poll and a fast reconnect could deliver the same tail concurrently.
    await poll();
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectStream, 2000);
  };
}

/* ————— boot ————— */

(async () => {
  try { await document.fonts.load('16px "VT323"'); } catch {}
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game",
    width: MAPW * T * ZOOM, height: MAPH * T * ZOOM,
    pixelArt: true, roundPixels: true,
    backgroundColor: "#142317",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: Village,
  });
  window.__burrow = game;
  game.events.on("ready", () => {
    scene = game.scene.getScene("village");
    window.__burrow.village = scene;   // map self-check hook, see checkMap()
    scene.events.once("create", async () => {
      await poll();
      connectStream();
      // Idle while SSE is healthy; this is the fallback when it is not.
      setInterval(poll, 2000);
    });
  });
})();
</script>
</body>
