services:
  arcadia:
    image: nginx:1.29-alpine
    container_name: arcadia
    restart: unless-stopped
    ports:
      - "8737:8737"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dist:/srv/arcadia:ro
      - ./observatory-dist:/srv/observatory:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
