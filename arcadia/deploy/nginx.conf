events {}

http {
    # Without this table nginx knows html, gif and jpeg and nothing else, and hands every
    # module script out as text/plain — which the browser refuses, so both SPAs render a
    # blank page while every curl-based check stays green (2026-09-02). deploy/smoke.sh
    # now asks for the module's Content-Type as well.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8737;
        server_name _;
        root /srv/arcadia;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /observatory {
            return 301 /observatory/;
        }

        location ^~ /observatory/ {
            alias /srv/observatory/;
            try_files $uri $uri/ @observatory_index;
        }

        location @observatory_index {
            root /srv/observatory;
            try_files /index.html =404;
        }

        location = /burrow/state {
            proxy_pass http://host.docker.internal:8738/state;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            add_header Cache-Control no-store always;
        }

        # Observatory currently consumes the same state contract at root-relative paths.
        location = /state {
            rewrite ^ /burrow/state last;
        }

        location = /burrow/state/stream {
            proxy_pass http://host.docker.internal:8738/state/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no always;
            add_header Cache-Control no-store always;
        }

        location = /state/stream {
            rewrite ^ /burrow/state/stream last;
        }

        location = /events {
            proxy_pass http://host.docker.internal:8738/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Both services answer `GET /residents`: steward's is the fleet's resident listing,
        # chronicle's is the manifest-validation report an operator checks after a deploy.
        # The bare path belongs to steward (below), so chronicle's answers under the
        # `/burrow/` prefix that already fronts its state routes. Without this block the
        # path is not claimed by anything and `location /` serves it the SPA's index.html
        # with a 200 — which is how it was unreachable rather than merely 404 (warren#242).
        location = /burrow/residents {
            proxy_pass http://host.docker.internal:8738/residents;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # An exact `location` matches one spelling only, and the trailing-slash one would
        # fall to the SPA and answer 200 again. Redirect it, the way /observatory does.
        location = /burrow/residents/ {
            return 301 /burrow/residents;
        }

        # Steward's routes, on the shared origin. `routines` is the fleet-wide standing-work
        # ledger the townhall Routines page reads; `requests` is how any of these pages
        # confirms a write — every mutating route answers 202 with a request id, and
        # GET /requests/{id} is the only honest "it actually applied" (warren#225). An
        # unproxied route falls through to the SPA and answers 200 with index.html, which
        # is a working control panel that silently confirms nothing. So this alternation is
        # steward's COMPLETE set of top-level paths (the `@app` decorators in
        # `steward/src/steward/api.py`) — `tasks` and `delegate` were the two it was missing,
        # which capped townhall at the delegation and task-lineage views it could not ship.
        # `arcadia/src/deployment.test.js` pins the list; add a route to steward, add it here.
        location ~ ^/(jobs|tasks|delegate|approvals|residents|skills|reload|routines|requests)(/|$) {
            proxy_pass http://host.docker.internal:8802;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
