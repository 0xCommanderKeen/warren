# Rendered by steward's nursery from residents/$resident_id/manifest.yaml.
#
# Do not edit this file on the host. It is regenerated from the manifest on every
# `steward new-resident`, and an edit made here is an edit nobody can read in git.
#
# Secrets are not in this file and never will be: BURROW_URL and BURROW_TOKEN are
# read from the .env beside it, which steward writes at provision time from its own
# environment and which no repository has ever seen.
services:
  $service:
    # steward-resident:latest unless the manifest names another: this repo's own image
    # (docker/resident/Dockerfile), carrying the claude CLI and burrow's hook emitter.
    # It is a local tag — there is no registry in this fleet — so it has to have been
    # built and shipped to this host first: `make image && make image-ship`.
    image: $image
    container_name: $container
    restart: unless-stopped
    working_dir: $memory_path
    environment:
      BURROW_AGENT_ID: $agent_id
      BURROW_PROJECT: $project
      BURROW_URL: $${BURROW_URL:?steward writes this into .env at provision time}
      BURROW_TOKEN: $${BURROW_TOKEN-}
      STEWARD_RESIDENT: $resident_id
    volumes:
      # The resident's declared memory location, at the path its own manifest names, so
      # a journal written inside the container is a journal on the NAS.
      - ./memory:$memory_path
      # The claude config the burrow emitter is installed into, exactly as life-agent's
      # claude-config volume carries burrow-emit.py today. The image's entrypoint seeds
      # this directory at start — burrow-emit.py every time, settings.json only when it
      # is not already there — so the volume also keeps the credentials a `docker exec
      # <container> claude` login writes, across restarts and image rebuilds.
      - ./claude:/root/.claude
    command: $command
