name: chronicle

on:
  push:
    branches: [main]
    paths:
      - "chronicle/**"
      - ".github/workflows/chronicle.yml"
  pull_request:
    paths:
      - "chronicle/**"
      - ".github/workflows/chronicle.yml"

concurrency:
  group: chronicle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: chronicle

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # run.sh itself must select the locked interpreter; wrapping it in uv here
      # would hide the clean-shell developer path this workflow is meant to prove.
      - run: sh tests/run.sh
