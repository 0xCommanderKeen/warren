name: chronicle

on:
  push:
    branches: [main]
    paths:
      - "chronicle/**"
      - ".github/workflows/chronicle.yml"
  pull_request:
    paths:
      - "chronicle/**"
      - ".github/workflows/chronicle.yml"

concurrency:
  group: chronicle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: chronicle

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run sh tests/run.sh
