name: townhall

on:
  push:
    branches: [main]
    paths:
      - "townhall/**"
      # Townhall's transport tests read Chronicle's fixture in-tree rather than
      # vendoring it, so a change to that fixture must run this suite.
      - "chronicle/tests/fixtures/state-contract/**"
      # And its dev proxy is checked against Steward's own route decorators, so a
      # route added there must run this suite too (warren#242).
      - "steward/src/steward/api.py"
      - ".github/workflows/townhall.yml"
  pull_request:
    paths:
      - "townhall/**"
      - "chronicle/tests/fixtures/state-contract/**"
      - "steward/src/steward/api.py"
      - ".github/workflows/townhall.yml"

concurrency:
  group: townhall-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: townhall

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: townhall/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
