name: townhall

on:
  push:
    branches: [main]
    paths:
      - "townhall/**"
      # Townhall's transport tests read Chronicle's fixture in-tree rather than
      # vendoring it, so a change to that fixture must run this suite.
      - "chronicle/tests/fixtures/state-contract/**"
      # And its dev proxy is checked against Steward's own route decorators, so a
      # route added there must run this suite too (warren#242).
      - "steward/src/steward/api.py"
      # …and the route factories beside it, which is where every route has actually
      # been declared since they were split out. Listing only api.py meant a route
      # added in routes/ never ran this suite — the same silent drift as #242.
      - "steward/src/steward/routes/**"
      # The shape half of the same seam: the client is checked against Steward's
      # committed OpenAPI document, read in-tree (warren#321).
      - "steward/docs/openapi.json"
      - ".github/workflows/townhall.yml"
  pull_request:
    paths:
      - "townhall/**"
      - "chronicle/tests/fixtures/state-contract/**"
      - "steward/src/steward/api.py"
      - "steward/src/steward/routes/**"
      - "steward/docs/openapi.json"
      - ".github/workflows/townhall.yml"

concurrency:
  group: townhall-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: townhall

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: townhall/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
