name: steward

# chronicle/hooks/** is in the filter on purpose (warren#234). The emitter every resident
# runs is built from those files and vendored into docker/resident/burrow-emit.py, and
# tests/test_resident_image.py rebuilds the bundle and compares it byte for byte. Without
# this line a chronicle-only PR would never run that comparison, and the drift would first
# be noticed by whoever next ran `make vendor-emitter` — which is precisely how the copy
# went stale in the first place. An emitter change now turns steward red until it is
# re-vendored, in the same PR that made it.
on:
  push:
    branches: [main]
    paths:
      - "steward/**"
      - "chronicle/hooks/**"
      - ".github/workflows/steward.yml"
  pull_request:
    paths:
      - "steward/**"
      - "chronicle/hooks/**"
      - ".github/workflows/steward.yml"

permissions:
  contents: read

concurrency:
  group: steward-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: steward

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run ty check src/ tests/

      # This job reads docker/resident/ without building it — the `image` job below does
      # the building. What it reads is drift: tests/test_resident_image.py rebuilds
      # chronicle's emitter bundle from ../chronicle at HEAD and compares it to the
      # vendored docker/resident/burrow-emit.py byte for byte (refresh it with
      # `make vendor-emitter`), and holds the two copies of the CLAUDE_VERSION pin to each
      # other. Neither is a thing a build would notice.
      - name: Tests
        run: uv run pytest

      # An invalid manifest must never merge: it would imply duties or access
      # that no resident actually has.
      - name: Validate residents
        run: uv run steward validate

  # The resident runtime image (steward #158). Until this job existed, the apt and npm
  # layers, entrypoint.sh and smoke.sh had no execution coverage anywhere in the
  # repository: their first run after any change was on somebody's laptop or on the NAS.
  # Build only — there is no registry in this fleet, so nothing is pushed and `make
  # image-ship` stays a human's deliberate act.
  image:
    # After `check`, not beside it: tests/test_resident_image.py reads the pin, the digest
    # and the vendored emitter off the files in a millisecond, and there is no sense
    # spending minutes on a build when a millisecond already said no.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The same target a human runs, so what CI proves is what a human would get:
      # linux/amd64 for the NAS, the pinned base digest, the pinned claude, and the
      # Dockerfile's own `claude --version` check inside the npm layer.
      - name: Build the resident image
        run: make image

      # An image that cannot say what it was built from is an image nobody can debug.
      - name: Check the revision label
        run: |
          revision=$(docker image inspect steward-resident:latest \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          echo "org.opencontainers.image.revision=$revision"
          test "$revision" = "$(git rev-parse HEAD)"

      # smoke.sh needs a village that answers 204 on POST /events, and CI has no
      # credentials for the real one — so it gets a village that knows how to say 204 and
      # nothing else. That is enough to run every one of smoke.sh's four checks for real,
      # including the last one, which feeds a hook payload to the vendored emitter and
      # asserts it delivered rather than falling back to the local log. It runs inside the
      # image being tested, because that image already carries the python3 it needs.
      - name: Start a village that only says 204
        run: |
          cat > "$RUNNER_TEMP/village.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("content-length") or 0))
                  ok = self.path == "/events" and body.lstrip().startswith(b"{")
                  self.send_response(204 if ok else 400)
                  self.end_headers()
                  print(self.path, len(body), flush=True)

              def log_message(self, *args):
                  pass


          HTTPServer(("0.0.0.0", 8737), Handler).serve_forever()
          PY
          docker network create village-net
          docker run -d --name village --network village-net \
            -v "$RUNNER_TEMP/village.py:/village.py:ro" \
            --entrypoint python3 steward-resident:latest /village.py
          # `docker run -d` returns when the container started, not when python has bound
          # the port. Without this wait a slow bind reads as "the village is unreachable",
          # which is a red build for the one reason that is not a real failure. The probe
          # runs inside the village's own container so that no port has to be published on
          # the runner — nothing here needs to be reachable from outside docker.
          for _ in $(seq 30); do
            if docker exec village curl -sf -o /dev/null \
                 -X POST http://127.0.0.1:8737/events \
                 -H 'Content-Type: application/json' --data '{}'; then
              exit 0
            fi
            sleep 1
          done
          echo "the village never came up"
          docker logs village
          exit 1

      # steward-smoke exits non-zero unless the village answered 204, and it only finds the
      # emitter and settings.json at all because entrypoint.sh seeded /root/.claude first —
      # so this one command is the execution coverage for smoke.sh and for the entrypoint's
      # "no settings.json yet" path.
      - name: Run the entrypoint and steward-smoke against it
        run: |
          docker run --rm --network village-net \
            -e CHRONICLE_URL=http://village:8737 \
            -e BURROW_URL=http://village:8737 \
            -e SMOKE_AGENT_ID=steward:pip \
            -e CHRONICLE_PROJECT=pip \
            steward-resident:latest steward-smoke

      # The other entrypoint path: a resident that already has a settings.json keeps it, and
      # is told — loudly, without being taken down over telemetry — when what it kept does
      # not wire the emitter. That branch is a dozen lines of inline python3 that nothing
      # else in this repository ever runs.
      - name: Run the entrypoint against a settings.json that wires nothing
        run: |
          mkdir -p "$RUNNER_TEMP/claude"
          echo '{"hooks":{}}' > "$RUNNER_TEMP/claude/settings.json"
          docker run --rm -v "$RUNNER_TEMP/claude:/root/.claude" steward-resident:latest true \
            2>&1 | tee /dev/stderr | grep -q "does not wire burrow-emit.py"

      - name: Show what the village received, then take it down
        if: always()
        run: |
          docker logs village || true
          docker rm -f village >/dev/null 2>&1 || true
          docker network rm village-net >/dev/null 2>&1 || true
