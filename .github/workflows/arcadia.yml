name: arcadia

on:
  push:
    branches: [main]
    paths:
      - "arcadia/**"
      # Arcadia's contract tests read Burrow's fixture in-tree rather than
      # vendoring it, so a change to that fixture must run this suite.
      - "chronicle/tests/fixtures/state-contract/**"
      # The deployment test derives the origin's Steward routes from Steward's own
      # decorators, so a route added there must run this suite or nginx drifts
      # silently — which is what warren#242 was.
      - "steward/src/steward/api.py"
      # …and the route factories beside it, which is where every route has actually
      # been declared since they were split out. Listing only api.py meant a route
      # added in routes/ never ran this suite — the same silent drift as #242.
      - "steward/src/steward/routes/**"
      - ".github/workflows/arcadia.yml"
  pull_request:
    paths:
      - "arcadia/**"
      - "chronicle/tests/fixtures/state-contract/**"
      - "steward/src/steward/api.py"
      - "steward/src/steward/routes/**"
      - ".github/workflows/arcadia.yml"

concurrency:
  group: arcadia-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arcadia

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          package_json_file: arcadia/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arcadia/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
