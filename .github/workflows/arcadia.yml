name: arcadia

on:
  push:
    branches: [main]
    paths:
      - "arcadia/**"
      # Arcadia's contract tests read Burrow's fixture in-tree rather than
      # vendoring it, so a change to that fixture must run this suite.
      - "chronicle/tests/fixtures/state-contract/**"
      # The deployment test derives the origin's Steward routes from Steward's own
      # decorators, so a route added there must run this suite or nginx drifts
      # silently — which is what warren#242 was.
      - "steward/src/steward/api.py"
      - ".github/workflows/arcadia.yml"
  pull_request:
    paths:
      - "arcadia/**"
      - "chronicle/tests/fixtures/state-contract/**"
      - "steward/src/steward/api.py"
      - ".github/workflows/arcadia.yml"

concurrency:
  group: arcadia-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arcadia

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: arcadia/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arcadia/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
