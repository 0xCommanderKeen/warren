name: arcadia

on:
  push:
    branches: [main]
    paths:
      - "arcadia/**"
      - ".github/workflows/arcadia.yml"
  pull_request:
    paths:
      - "arcadia/**"
      - ".github/workflows/arcadia.yml"

concurrency:
  group: arcadia-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arcadia

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: arcadia/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arcadia/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
