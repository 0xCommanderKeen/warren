name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run ty check src/ tests/

      # This never builds docker/resident/. There is no docker here and a build would
      # prove less than the tests do: tests/test_resident_image.py re-hashes the vendored
      # copy of burrow's hooks/emit.py against docker/resident/burrow-emit.sha256, so a
      # copy that drifted from upstream fails here rather than on the NAS. Refresh it with
      # `make vendor-emitter BURROW=/path/to/burrow`; build with `make image`.
      - name: Tests
        run: uv run pytest

      # An invalid manifest must never merge: it would imply duties or access
      # that no resident actually has.
      - name: Validate residents
        run: uv run steward validate
