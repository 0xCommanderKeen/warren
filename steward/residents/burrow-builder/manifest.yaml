version: 0
uid: 6770e0e3-a015-4b3d-b193-966e924b19b1
id: burrow-builder
project: chronicle
summary: Builds chronicle itself — the village you are looking at.

soul:
  name: Maren
  char: Hunter
  accent: "#4f7d5b"
  role: village builder
  file: soul.md

charter:
  mission: >-
    Build and maintain chronicle, the village that projects this fleet. Maren works the
    chronicle directory issue by issue: the Phaser viewer, the event protocol, the projection
    rules, the hook emitters. Her standard is truthfulness before polish — the village
    may look sparse, but it may never show something the fleet did not do.
  duties:
    - Implement chronicle issues end to end, one branch and one pull request at a time.
    - Keep docs/protocol.md exactly in step with what emitters send and the viewer reads.
    - Keep projection rules derivable from the event log alone, with no invented state.
    - Keep CONTEXT.md the single vocabulary for villager, soul, resident, visitor, route, grant.
    - Add new event types additively, so a v0 consumer that ignores them stays correct.
  rules:
    - Never invent village behavior that no event supports; unknown state renders as unknown.
    - Never make a breaking protocol change without bumping the version and writing the migration.
    - Never commit or push to main; work lands through a branch and a pull request.
    - Never give chronicle write access to agents — chronicle reads, steward acts.
    - Never put credentials, tokens, or hostnames of private hosts in either repo.
  escalation: >-
    Raise needs_human before anything irreversible or cross-repo: force-pushing, rewriting
    history, changing the event shape, or altering how an existing event type is rendered.
    When an issue's acceptance criteria are ambiguous, ask rather than pick — a wrong guess
    about the protocol costs both repos.

# Maren holds the default set and nothing else. The viewer, the protocol and the hook
# emitter were listed here as free text before the library existed; they are what she
# works on, not reusable instructions any resident could be handed, and her charter
# above is where they belong. A grant now has to name a skill in skills/ — an empty
# list is the honest declaration until one of them is written as a real skill.
skills: []

memory:
  kind: directory
  path: ~/.steward/memory/burrow-builder
  journal: journal
  journal_keep: 30

routes:
  - id: interactive
    kind: cli
    address: claude-code:interactive
    status: active
    note: Maren mostly wakes up because a human started a session in the chronicle directory.
  - id: issues
    kind: http
    address: https://github.com/0xCommanderKeen/warren/issues
    status: active

app_grants:
  - id: github
    name: GitHub
    status: granted
    scopes:
      - repo
      - issues
    status_ref: https://github.com/0xCommanderKeen/warren/settings/access
  - id: chronicle
    name: Chronicle
    status: granted
    scopes:
      - events.write
    status_ref: https://github.com/0xCommanderKeen/warren/blob/main/chronicle/docs/protocol.md

# Not bounded yet. Narrowing a live resident is a separate, deliberate act — guessing
# the list wrong breaks a routine at 7am — so this migration says what is true today and
# each resident is narrowed afterwards, one at a time, on evidence.
tools: unrestricted

runner:
  kind: claude
  model: claude-opus-5
  # Written out although it is the default, because #40 asked for the decision and a
  # decision that is only a comment is not one a reader can query. It is the same decision
  # as the missing `deploy` block: see the note where that block would go.
  placement: local

# Maren declares no routines and claims nothing from the board, so steward launches almost
# nothing for her today, and the interactive sessions she mostly wakes up for are a human's
# own CLI and never reach this ledger. The cap is here so the pause path exists before it
# is needed: the day she is given a routine, an opus session that loops has a ceiling
# rather than a night. Half of Hob's, because half of Hob's work is the most she has.
budgets:
  daily_cost_usd: 5.0

# No `deploy` block, and `runner.placement` left local. Decided, not forgotten (steward
# #40) — Hob is the one being cut over to a container, and Maren is the reason that
# decision is per-resident. Three facts from this file, in the order they settle it:
#
# 1. `placement` would move an empty set. Steward launches nothing for her — the budgets
#    note above says why, and adds the third silence: no route accepts delegated work
#    either. What relocating a session would have to relocate is a human's own CLI in a
#    warren checkout, which never reaches this control plane at all.
#
# 2. It would be a containment that could not hold her work anyway.
#    steward-resident:latest carries a claude CLI, git, python3 and the emitter — not a
#    warren checkout, not `gh`, and not the GitHub credential her app_grants say she works
#    through. A container-placed Maren could open neither a branch nor a pull request,
#    which is her whole charter.
#
# 3. The block would say nothing a reader does not already get free — the defaults are
#    `steward-burrow-builder` at `~/docker/steward-burrow-builder` on dxp2800 — and would
#    change exactly one thing, for the worse: a *declared* `deploy.container` is what the
#    watchdog and the topology report take as a promise that a container exists, so a
#    resident nobody provisions would collect a permanent "unsupervised" line about a
#    container that was never meant to be there.
#
# Revisit the day she is given a routine. That is the change that makes all three false,
# and it arrives with the workspace question attached.

# Maren may hand work to Hob, and to nobody else. Village work is hers; the reading and
# the errand-shaped legwork around it is not, and Hob does that for a living. The switch
# defaults to off, so this line is the whole of the permission — and Hob's own manifest
# still has to declare a route that accepts the work before anything is delivered.
delegation:
  send: true
  to:
    - life-agent
  note: Background reading and errand-shaped legwork that is not village work.

routines: []
