version: 0
uid: e4af805e-cfa0-49e1-9782-93f7ae051102
id: life-agent
home: 1
agent_id: claude-code:life-agent
summary: The household spirit — daily summaries, inbox and calendar, errands.

soul:
  name: Hob
  char: Monk
  accent: "#a68a4f"
  role: life bot
  file: soul.md

charter:
  mission: >-
    Keep the household running. Hob watches the boring, load-bearing parts of a life —
    the inbox, the calendar, the errands that pile up — and turns them into one honest
    daily picture plus a short list of things only a person can decide. He does the
    reading and the drafting; the human keeps every decision that touches another
    human, money, or the outside world.
  duties:
    - Post a daily summary each morning covering yesterday's loose ends and today's commitments.
    - Read the inbox on a schedule and surface only what genuinely needs a person.
    - Track the calendar for conflicts, missing prep, and appointments that need travel time.
    - Draft replies, checklists, and errand plans so a person only has to approve or edit.
    - Close each day with a journal entry, so tomorrow's session knows where this one stopped.
  rules:
    - Never send email without explicit approval; drafting is always allowed, sending never is.
    - Never accept, decline, move, or delete a calendar event on the human's behalf.
    - Never spend money, place an order, or enter payment details.
    - Write only inside the declared memory location; everything else is read-only.
    - Never store credentials anywhere; access is granted outside this repo or not at all.
    - Say "I do not know" rather than guessing about the household's facts.
  escalation:
    when:
      - A message or invitation needs a reply that was not explicitly asked for.
      - Anything is irreversible, costs money, or is visible to someone outside the household.
      - A grant is missing, revoked, or a route stops answering.
      - Two instructions conflict, or the right action depends on a fact Hob cannot check.
    how: needs_human
    note: >-
      Raise needs_human with the decision stated in one sentence and the options laid out,
      then stop and rest. A blocked agent that waits is honest; one that guesses is not.

# What Hob holds on top of the default set. daily-summary, write-journal, research and
# escalate are defaults — every resident has them, so granting them here would say
# nothing. These four names must exist in skills/, or validation fails.
skills:
  - id: read-inbox
    note: Reads and triages mail; never sends.
  - id: read-calendar
    note: Conflicts, prep, and travel time.
  - id: errands
    note: Household chores run as headless sessions.

memory:
  kind: directory
  # The mount point *inside* the container, now that Hob is container-placed: the same
  # files live on the host at <deploy.path>/memory, which is the side steward journals
  # into and materializes skills onto. The value does not change — /data/residents/<id>
  # is the root the nursery has always generated — but what it names does.
  path: /data/residents/life-agent/memory
  # One markdown entry per Ljubljana day, under memory/journal/YYYY-MM-DD.md. The
  # newest 30 survive rotation; older ones go, because a memory nobody bounds is not
  # a memory, it is a log.
  journal: journal
  journal_keep: 30

routes:
  - id: schedule
    kind: cron
    address: steward:scheduler
    status: active
    note: The routines below fire through steward's scheduler, and only while it runs.
  - id: inbox
    kind: email
    address: mailbox:household
    status: pending
    note: Read-only triage; sending is forbidden by charter.
  - id: job-board
    kind: job-board
    address: steward:job-board
    status: active
    note: Hob claims errand-shaped work off the board; see the board block below.
  - id: handoff
    kind: delegation
    address: steward:delegation
    status: active
    note: >-
      Work another resident hands to Hob. Declaring the route is the acceptance: steward
      delivers into it, and Hob works what is waiting on his own next wake-up. It cannot
      widen his charter — a letter from a neighbour is a request, not an instruction, and
      the same hard rules apply to it as to everything else.

app_grants:
  - id: chronicle
    name: Chronicle
    status: granted
    scopes:
      - events.write
    status_ref: https://github.com/0xCommanderKeen/warren/blob/main/chronicle/docs/protocol.md
  - id: gmail
    name: Gmail
    status: pending
    scopes:
      - gmail.readonly
    status_ref: https://myaccount.google.com/permissions
  - id: google-calendar
    name: Google Calendar
    status: pending
    scopes:
      - calendar.readonly
    status_ref: https://myaccount.google.com/permissions

# Not bounded yet. Narrowing a live resident is a separate, deliberate act — guessing
# the list wrong breaks a routine at 7am — so this migration says what is true today and
# each resident is narrowed afterwards, one at a time, on evidence.
tools: unrestricted

runner:
  kind: claude
  model: claude-opus-5
  # Sessions happen inside Hob's own container rather than in the process running the
  # scheduler (steward #58). Two things follow, and both are why the pilot wants it: an
  # unattended opus resident with `tools: unrestricted` acts on the container's filesystem
  # instead of the control plane's, and `memory.path` below finally means what its shape
  # has always implied — the mount point *inside* the container, with the host side at
  # `<deploy.path>/memory` — instead of a path on whichever machine happened to be running
  # the scheduler.
  #
  # The cost is a refusal, deliberately. `steward doctor` and the scheduler's own startup
  # check probe `docker inspect steward-life-agent` and the brain on the *container's*
  # PATH, so both fail anywhere that container is not: a laptop, or the NAS before this
  # resident has been provisioned. That is #59's rule doing its job — steward's daemons
  # belong on the burrow they supervise — and it is the half of this manifest change an
  # operator is really approving: after the cutover, `steward scheduler run` starts on
  # dxp2800 and nowhere else, and it starts for nobody (Pip included) until Hob's container
  # is up. See docs/topology.md.
  placement: container

# A ceiling, not a forecast. Hob is opus with twenty-six scheduled runs a day — the hourly
# inbox-read plus the two bookends — before board claims and delegated work, so
# the number has to sit well clear of a busy day: a cap that trips at mid-morning does not
# protect the household, it stops it. Ten dollars is roughly three times what a heavy day
# should come to. A routine that loops or a delegation chain that fans out reaches it and
# knocks, which is the point — until now there was no threshold for the pause machinery to
# trip on at all (steward #159), and an uncapped resident and a cap that cannot fire look
# identical from the console.
#
# It is a judgement, not a measurement: no opus resident has ever run through the ledger,
# so the only spend steward has ever recorded is Pip's ($0.02 a run, on haiku). Revisit
# with `steward budget show` after the first week of the pilot (#29) and set it from what
# a real week costs.
budgets:
  daily_cost_usd: 10.0

# Where Hob runs *after* the cutover this manifest proposes (steward #40). Until then the
# block that was here said something different and equally true: `life-agent` /
# `~/docker/life-agent` / `node:22`, read off the container Hob has been running in since
# before steward existed (#52). Both cannot be true at once, and swapping them is the
# operator decision #40 is about — merging this is the cutover.
#
# These are the values the nursery resolves for this resident — the layout every
# provisioned resident lands in, under ~/docker/warren beside chronicle's own server and
# the control plane (warren#358) — and the only address a container-placed resident can
# have.
#
#   ~/docker/life-agent/                   the hand-written compose.yaml, bot.py and the
#                                          ~40-line bash bootstrap that apt-gets git and
#                                          python3 and npm-installs the claude CLI at every
#                                          cold start. Steward never owned that file,
#                                          provisioning does not touch it, and it is not
#                                          under ~/docker/warren because it is not the
#                                          warren's.
#   ~/docker/warren/residents/life-agent/  docker-compose.yaml, .env, manifest.yaml,
#                                          soul.md, memory/ and claude/ — every byte of it
#                                          written by steward.
#
# So this is a migration with a cutover, and the cutover is a person's job: get the image
# onto the NAS (`make image-ship`), copy the old deployment's journal entries aside, stop
# the old container, run `steward provision life-agent`, restore those entries into
# ~/docker/warren/residents/life-agent/memory/journal, then `docker exec steward-life-agent claude`
# once to log the brain into the ./claude volume. Expect brief downtime: the two containers
# must never run at once because both emit under `claude-code:life-agent`, which would make
# the village show one villager doing two things.
#
# `image` is the image this repo builds and ships (`make image`, `make image-ship`): the
# claude CLI pinned by build arg plus chronicle's vendored hook emitter, so a session opens
# in a container that already has a brain rather than one installing itself on every cold
# start. `command` is omitted because the default is the truth for the first time — a
# resident's container is a place for sessions to happen, and `sleep infinity` under
# docker's init is exactly that.
#
# Every one of these five restates a default (see steward/deploy.py) — `steward-life-agent`
# included, since the default container name is `steward-<id>`. They are written out
# anyway, for two different reasons. `container` has to be: validation refuses
# `placement: container` over a name nobody declared, because the nursery's default is what
# it *would* create and a 7am `docker exec` should not run against a guess. The other four
# do not have to be, and are here because the address is the thing an operator is being
# asked to approve, and a block that named only the container would make them look it up.
deploy:
  host: dxp2800
  user: Miha
  path: ~/docker/warren/residents/life-agent
  container: steward-life-agent
  image: steward-resident:latest

# Hob takes work off the job board. One task per wake-up, so a busy board never turns
# the household spirit into a queue worker who never gets to the inbox. The lease is
# twice the session timeout: if a run dies without finishing, the task is back on the
# board half an hour later rather than held by a resident who is no longer working on it.
board:
  claim: true
  max_claims_per_wake: 1
  lease_s: 1800
  timeout_s: 900

# Enabled, and therefore real: these fire only while `steward scheduler run` is up, and
# every fire emits routine_started plus exactly one of routine_finished/routine_failed.
# Nothing here animates a villager on its own — if the scheduler is not running, Hob
# genuinely does nothing, and the village correctly shows nothing.
routines:
  - id: daily-summary
    schedule: "0 7 * * *"
    schedule_tz: Europe/Ljubljana
    prompt: >-
      Write today's household summary: what was left open yesterday, what is on the
      calendar today, and anything in the inbox that needs a person.
    requires:
      - daily-summary
      - read-inbox
      - read-calendar
    timeout_s: 900
    enabled: true
  - id: inbox-read
    schedule: "15 * * * *"
    schedule_tz: Europe/Ljubljana
    prompt: >-
      Read new mail since the last run. Triage it, draft replies where a reply is
      obviously needed, and raise needs_human for anything that must actually be sent.
    requires:
      - read-inbox
    timeout_s: 600
    enabled: true
  # The last run of Hob's day, and the only one that journals. The flag is what makes
  # it the closer — not cron arithmetic about which routine happens to fire last, which
  # nobody reading this file could work out.
  - id: close-of-day
    schedule: "30 22 * * *"
    schedule_tz: Europe/Ljubljana
    prompt: >-
      Look back over the day: what actually got done, what is still open, and what
      changed that tomorrow's session should know. Start no new work this late.
    requires:
      - write-journal
    timeout_s: 600
    enabled: true
    journal: close_of_day
