# Steward's control plane on a burrow — the NAS today. Published to ~/docker/warren/steward by
# deploy/deploy.sh (or by hand: it is one file), read by `docker compose` there.
#
# Four processes, one image, one database:
#
#   api        `steward serve`          the token-gated HTTP API townhall and the CLI write to
#   scheduler  `steward scheduler run`  fires routines; a locally-placed session runs in here
#   watchdog   `steward watchdog run`   notices dead runs and unsupervised containers
#   chat       `steward chat run`       polls the residents' Telegram/Discord bots
#
# The daemons run on the burrow whose containers they supervise (docs/topology.md), and
# "on the burrow" is about docker, not the machine: both get this host's docker socket,
# and the image carries a docker client to use it with. STEWARD_BURROW names the machine
# because a container's hostname is its id.
#
# Secrets are not in this file and never will be. STEWARD_TOKEN lives in the .env beside
# it (mode 0600), which no repository has ever seen; STEWARD_IMAGE_TAG is written into
# that same .env by deploy/deploy.sh so that a rollback is "edit one line, `up -d`".
#
# Bot tokens have their own home since warren#462: ./secrets (mode 0700), one file per
# credential named for the variable it replaces, each mode 0600. The API mounts it
# read-write because `PUT /secrets/{name}` is what writes into it — a step that used to be
# an ssh heredoc into the .env, which no agent session is allowed to perform. The chat
# daemon mounts it read-only and re-reads it on its route-recheck timer, so a token set
# through the API reaches "reachable, bot @Name" without `--force-recreate`. Resolution is
# file first, environment second, so every token still in the .env below keeps working and
# nothing has to migrate. The scheduler gets it read-only too: it delivers a routine's
# final message over the same routes (warren#385). The
# deploy key that pushes the residents checkout is the file residents-key beside them,
# mode 0600, mounted into the API and nothing else (deploy/README.md says how it is made).
# Each daemon's local event log and undelivered queue instead live under ./data, named by
# service below: they are operational state, not configuration, and survive a recreate.
#
# The residents tree is NOT the image's (warren#351). It is a git checkout on the burrow —
# ~/docker/warren/steward/residents-repo, a sparse clone of this repository on the branch
# burrow/residents, made once by deploy/deploy.sh and never reset by it — bind-mounted at
# /checkout. The API reads and writes /checkout/steward/residents and the skills library
# beside it, commits every write, and pushes the branch, best effort. The daemons mount the
# same checkout read-only: the standing rule that only the API writes declarations, written
# into the mounts. The checkout is authoritative for this burrow's residents; steward/
# residents/ in the repository is the seed a new burrow is cloned from, not a place charters
# are edited. The image still carries a copy of that seed. STEWARD_RESIDENTS gives every
# process, including bare `docker exec steward-api steward ...` commands, the live tree
# as its default; only an explicit path override reads the seed.
#
# Every process reads the same checkout. The scheduler and watchdog partition that tree by
# deploy.host through topology.py, so a burrow acts only for its own residents — and an
# edit the API commits is what they read on their next wake-up, with no restart. Before
# warren#351 they read a copy taken at container start, which nothing ever updated.
#
# Every process also needs the burrow's *resident* directories (warren#356). A container-
# placed resident lives at <deploy.path> on this host — ~/docker/warren/residents/<id> —
# and its memory/ is the host side of the mount the scheduler journals into and
# materializes skills onto (deploy.memory_host_dir); the API is the process that writes
# the bundle there and brings the container up (deploy.BurrowTransport). All three mount
# the residents directory at its HOST path and resolve every ~/ against
# STEWARD_BURROW_HOME, never against the image's /root: the path each computes is then the
# directory the host has, and the paths the API hands docker are ones the daemon can bind.
# That directory and no wider (warren#358): the control plane's own directory beside it
# holds the .env and the deploy key, and the daemons have no business with either. Without
# the mount every container-placed resident is "unprovisioned" to the scheduler no matter
# what was provisioned, and it refuses to start.

x-steward-environment: &steward-environment
  STEWARD_RESIDENTS: /checkout/steward/residents
  STEWARD_STATE: /data/state.json
  STEWARD_BURROW: dxp2800
  # The deploy user's home on this machine: what every ~/ in a manifest or a rendered
  # path means to the API, the scheduler and the watchdog alike, instead of the image's
  # /root. The residents mount below sits at the same path in every container.
  STEWARD_BURROW_HOME: /home/Miha
  # The village, through arcadia's origin, which proxies /events to chronicle on 8738.
  CHRONICLE_URL: http://dockerhost:8737
  # Resident sessions present their per-run credential to this host-published API.
  # Their compose projects have separate networks, so steward-api is not resolvable there.
  STEWARD_URL: http://dockerhost:8802
  # Read by the API alone: every commit the write API makes is pushed to this branch of
  # the checkout's origin. Best effort — a save is durable before the push starts, and a
  # burrow that cannot reach GitHub answers "committed, not pushed" and carries on. Never
  # main: nothing lands there without a pull request, and a push to any other branch
  # deploys nothing, so a charter edit cannot loop into a rollout of the fleet it edited.
  STEWARD_PUSH_BRANCH: burrow/residents
  # The credential directory, at the path every container mounts it on below.
  STEWARD_SECRETS_DIR: /secrets
  # Bot tokens stay in the .env beside this compose file. Empty defaults let a fresh
  # burrow come up green before chat is wired; the chat daemon names what it awaits.
  STEWARD_CHAT_TOKEN_PIP: ${STEWARD_CHAT_TOKEN_PIP:-}
  STEWARD_CHAT_TOKEN_DISCORD_PIP: ${STEWARD_CHAT_TOKEN_DISCORD_PIP:-}
  STEWARD_CHAT_TOKEN_HOB: ${STEWARD_CHAT_TOKEN_HOB:-}
  STEWARD_CHAT_OPERATORS: ${STEWARD_CHAT_OPERATORS:-}
  STEWARD_CHAT_DISCORD_GUILD: ${STEWARD_CHAT_DISCORD_GUILD:-}
  # One fleet webhook carries one-way knocks; blank keeps Discord notifications inert.
  STEWARD_NOTIFY_DISCORD_WEBHOOK: ${STEWARD_NOTIFY_DISCORD_WEBHOOK:-}
  TZ: Europe/Ljubljana

x-steward: &steward
  image: steward-cp:${STEWARD_IMAGE_TAG:?written by deploy/deploy.sh into .env}
  restart: unless-stopped
  init: true
  env_file: .env
  environment: *steward-environment
  extra_hosts:
    - "dockerhost:host-gateway"
  # No volumes here: a YAML merge is shallow and a list does not merge, so every service
  # states its own mounts in full below — which is also where the read/write split lives.

services:
  api:
    <<: *steward
    container_name: steward-api
    environment:
      <<: *steward-environment
      STEWARD_EVENTS_FALLBACK: /data/events/api.jsonl
    ports:
      - "8802:8801"
    volumes:
      - ./data:/data
      # The one writable mount of the checkout.
      - ./residents-repo:/checkout
      # The deploy key the push uses; the image's GIT_SSH_COMMAND names this path.
      - ./residents-key:/run/steward/residents-key:ro
      # The one writable mount of the credential directory: PUT /secrets/{name} lands here.
      - ./secrets:/secrets
      # This burrow's residents, at the SAME path as on the host, and the socket to bring
      # them up: the API provisions a resident of this burrow itself rather than ssh-ing
      # to the machine it is on (which it cannot — warren#356). Same path because the
      # compose CLI in here resolves a bundle's ./memory against the project directory
      # and hands the daemon host paths; a different mount point would bind nothing.
      - /home/Miha/docker/warren/residents:/home/Miha/docker/warren/residents
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["steward", "serve", "--host", "0.0.0.0", "--port", "8801", "--residents", "/checkout/steward/residents"]

  scheduler:
    <<: *steward
    container_name: steward-scheduler
    environment:
      <<: *steward-environment
      STEWARD_EVENTS_FALLBACK: /data/events/scheduler.jsonl
    volumes:
      - ./data:/data
      - ./residents-repo:/checkout:ro
      - ./secrets:/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The residents' deploy directories, at the path every process computes for them.
      - /home/Miha/docker/warren/residents:/home/Miha/docker/warren/residents
    # The absolute path is belt and braces: the first rollout crash-looped on a login shell
    # that re-read /etc/profile, reset PATH, and lost /app/.venv/bin.
    command: ["/app/.venv/bin/steward", "scheduler", "run", "--residents", "/checkout/steward/residents"]

  watchdog:
    <<: *steward
    container_name: steward-watchdog
    environment:
      <<: *steward-environment
      STEWARD_EVENTS_FALLBACK: /data/events/watchdog.jsonl
    volumes:
      - ./data:/data
      - ./residents-repo:/checkout:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/Miha/docker/warren/residents:/home/Miha/docker/warren/residents
    # The same tree as the scheduler, and it must stay the same tree: a watchdog reading a
    # wider list than the scheduler fires would report residents nobody is running.
    command: ["/app/.venv/bin/steward", "watchdog", "run", "--residents", "/checkout/steward/residents"]

  chat:
    <<: *steward
    container_name: steward-chat
    environment:
      <<: *steward-environment
      STEWARD_EVENTS_FALLBACK: /data/events/chat.jsonl
    volumes:
      - ./data:/data
      - ./residents-repo:/checkout:ro
      - ./secrets:/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/Miha/docker/warren/residents:/home/Miha/docker/warren/residents
    command: ["/app/.venv/bin/steward", "chat", "run", "--residents", "/checkout/steward/residents"]
