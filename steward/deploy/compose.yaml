# Steward's control plane on a burrow — the NAS today. Published to ~/docker/warren/steward by
# deploy/deploy.sh (or by hand: it is one file), read by `docker compose` there.
#
# Three processes, one image, one database:
#
#   api        `steward serve`          the token-gated HTTP API townhall and the CLI write to
#   scheduler  `steward scheduler run`  fires routines; a locally-placed session runs in here
#   watchdog   `steward watchdog run`   notices dead runs and unsupervised containers
#
# The daemons run on the burrow whose containers they supervise (docs/topology.md), and
# "on the burrow" is about docker, not the machine: both get this host's docker socket,
# and the image carries a docker client to use it with. STEWARD_BURROW names the machine
# because a container's hostname is its id.
#
# Secrets are not in this file and never will be. STEWARD_TOKEN lives in the .env beside
# it (mode 0600), which no repository has ever seen; STEWARD_IMAGE_TAG is written into
# that same .env by deploy/deploy.sh so that a rollback is "edit one line, `up -d`". The
# deploy key that pushes the residents checkout is the file residents-key beside them,
# mode 0600, mounted into the API and nothing else (deploy/README.md says how it is made).
#
# The residents tree is NOT the image's (warren#351). It is a git checkout on the burrow —
# ~/docker/warren/steward/residents-repo, a sparse clone of this repository on the branch
# burrow/residents, made once by deploy/deploy.sh and never reset by it — bind-mounted at
# /checkout. The API reads and writes /checkout/steward/residents and the skills library
# beside it, commits every write, and pushes the branch, best effort. The daemons mount the
# same checkout read-only: the standing rule that only the API writes declarations, written
# into the mounts. The checkout is authoritative for this burrow's residents; steward/
# residents/ in the repository is the seed a new burrow is cloned from, not a place charters
# are edited. The image still carries a copy of that seed, and nothing here reads it.
#
# Every process reads the same checkout. The scheduler and watchdog partition that tree by
# deploy.host through topology.py, so a burrow acts only for its own residents — and an
# edit the API commits is what they read on their next wake-up, with no restart. Before
# warren#351 they read a copy taken at container start, which nothing ever updated.
#
# The daemons also need the burrow's *resident* directories (warren#356). A container-placed
# resident lives at <deploy.path> on this host — ~/docker/warren/residents/<id>, written by
# `steward provision` — and its memory/ is the host side of the mount the scheduler journals
# into and materializes skills onto (deploy.memory_host_dir). Steward resolves that `~` in
# the process that asks, and inside this image HOME is /root, so the host's residents
# directory is mounted at /root/docker/warren/residents: the path the daemons compute is
# then the directory the host has. That directory and no wider (warren#358): the control
# plane's own directory beside it holds the .env and the deploy key, and the daemons have
# no business with either. Without the mount every container-placed resident is
# "unprovisioned" to the scheduler no matter what was provisioned, and it refuses to start.

x-steward: &steward
  image: steward-cp:${STEWARD_IMAGE_TAG:?written by deploy/deploy.sh into .env}
  restart: unless-stopped
  init: true
  env_file: .env
  environment:
    STEWARD_STATE: /data/state.json
    STEWARD_BURROW: dxp2800
    # The village, through arcadia's origin, which proxies /events to chronicle on 8738.
    CHRONICLE_URL: http://dockerhost:8737
    # The pre-rename spelling, kept for one release (warren#216).
    BURROW_URL: http://dockerhost:8737
    # Read by the API alone: every commit the write API makes is pushed to this branch of
    # the checkout's origin. Best effort — a save is durable before the push starts, and a
    # burrow that cannot reach GitHub answers "committed, not pushed" and carries on. Never
    # main: nothing lands there without a pull request, and a push to any other branch
    # deploys nothing, so a charter edit cannot loop into a rollout of the fleet it edited.
    STEWARD_PUSH_BRANCH: burrow/residents
    TZ: Europe/Ljubljana
  extra_hosts:
    - "dockerhost:host-gateway"
  # No volumes here: a YAML merge is shallow and a list does not merge, so every service
  # states its own mounts in full below — which is also where the read/write split lives.

services:
  api:
    <<: *steward
    container_name: steward-api
    ports:
      - "8802:8801"
    volumes:
      - ./data:/data
      # The one writable mount of the checkout.
      - ./residents-repo:/checkout
      # The deploy key the push uses; the image's GIT_SSH_COMMAND names this path.
      - ./residents-key:/run/steward/residents-key:ro
    command: ["steward", "serve", "--host", "0.0.0.0", "--port", "8801", "--residents", "/checkout/steward/residents"]

  scheduler:
    <<: *steward
    container_name: steward-scheduler
    volumes:
      - ./data:/data
      - ./residents-repo:/checkout:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # The residents' deploy directories, at the path the daemons compute for them.
      - /home/Miha/docker/warren/residents:/root/docker/warren/residents
    # The absolute path is belt and braces: the first rollout crash-looped on a login shell
    # that re-read /etc/profile, reset PATH, and lost /app/.venv/bin.
    command: ["/app/.venv/bin/steward", "scheduler", "run", "--residents", "/checkout/steward/residents"]

  watchdog:
    <<: *steward
    container_name: steward-watchdog
    volumes:
      - ./data:/data
      - ./residents-repo:/checkout:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/Miha/docker/warren/residents:/root/docker/warren/residents
    # The same tree as the scheduler, and it must stay the same tree: a watchdog reading a
    # wider list than the scheduler fires would report residents nobody is running.
    command: ["/app/.venv/bin/steward", "watchdog", "run", "--residents", "/checkout/steward/residents"]
