# Rendered by steward's nursery from residents/<id>/manifest.yaml.
#
# Do not edit this file on the host. It is regenerated from the manifest on every
# provision — `steward new-resident` or `steward provision` — and an edit made here is an
# edit nobody can read in git.
#
# Secrets are not in this file and never will be: BURROW_URL and BURROW_TOKEN are
# read from the .env beside it, which steward writes at provision time from its own
# environment and which no repository has ever seen.
#
# The body below is serialised from a Python dict with yaml.safe_dump, so every value
# a manifest carries is quoted as data and can never reopen this document as markup.
